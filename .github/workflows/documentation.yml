name: Documentation and Pages

# Release publication owns binaries and the generated show. This workflow runs once for each
# published release, then attaches documentation/performance evidence and rebuilds the full site.
on:
  workflow_run:
    workflows: ["CI and release"]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild documentation even when this release is already marked complete
        type: boolean
        default: false
      promote_marketing:
        description: Promote the newly generated marketing preview to the live prefix
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-documentation
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  release-metadata:
    name: Check for an undocumented release
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.release.outputs.run }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve the latest release and its documentation marker
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release view --json tagName --jq .tagName)"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          sha="$(git rev-list -n 1 "$tag")"
          documented="$(gh release view "$tag" --json assets \
            --jq 'any(.assets[]; .name == "report-documentation.json")')"
          run=false
          if [[ "$documented" != true || "$FORCE" == true ]]; then run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$run" == false ]]; then
            echo "Release $tag is already documented; no expensive jobs are required."
          fi

  release-performance:
    name: Performance / Measure published release
    if: needs.release-metadata.outputs.run == 'true'
    needs: release-metadata
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release-metadata.outputs.version }}
      RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Inline rather than the shared action: these jobs check out the released commit, which
      # predates it. Keeps package downloads from waiting forever on a silent mirror.
      - name: Tune package downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/99-tosklight-ci >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          CONF

      - name: Install released Desk runtime dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y xvfb libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 libasound2 libxdo3 libgl1-mesa-dri mesa-vulkan-drivers; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Measure the published Linux bundle
        id: measure
        shell: bash
        env:
          # A runner has no GPU, and the Desk's web view never paints if it waits for one: the
          # accelerated paths report themselves as present and then produce no frame.
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          # The web view runs from an unpacked AppImage, where WebKit's own bubblewrap sandbox
          # cannot start its web process and fails silently — an app that answers on its port
          # while the window stays empty. Only this measurement runner is affected.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          RUST_LOG: "info"
        run: |
          set -euo pipefail
          out=".artifacts/performance"
          tmp=".artifacts/tmp/release-performance"
          mkdir -p "$out" "$tmp/unpacked"
          archive="tosklight-bundle-linux_amd64.zip"
          gh release download "$RELEASE_TAG" --pattern "$archive" --dir "$tmp"
          unzip -q "$tmp/$archive" -d "$tmp/unpacked"
          benchmark="$(find "$tmp/unpacked" -type f -name light-benchmark -print -quit)"
          desk="$(find "$tmp/unpacked" -type f -name 'tosklight-desk-linux_amd64.AppImage' -print -quit)"
          fixture_library="$(find "$tmp/unpacked" -type d -name fixture-library -print -quit)"
          test -n "$benchmark"
          test -n "$desk"
          test -n "$fixture_library"
          chmod +x "$benchmark" "$desk"
          status=0
          # An explicit 24-bit screen, so the desk's renderer has a visual it can use.
          xvfb-run -a -s "-screen 0 1920x1080x24" node tools/run-desktop-performance.mjs \
            --application "$desk" \
            --output-dir "$out" \
            --demo-show assets/demo.show
          node tools/run-release-performance.mjs \
            --binary "$benchmark" \
            --output-dir "$out" \
            --version "$VERSION" \
            --commit "$RELEASE_SHA" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" \
            --fixture-package-dir "$fixture_library" \
            --desktop-scenarios "$out/desktop-scenarios.json" \
            --hardware-label "GitHub Actions ubuntu-22.04" || status=$?
          test -f "$out/status.json"
          cp "$out/status.json" "$out/report-performance-status.json"
          (cd "$out" && zip -q report-performance.zip ./*.json ./*.log ./*.md 2>/dev/null || \
            zip -q report-performance.zip ./*.json)
          gh release upload "$RELEASE_TAG" --clobber \
            "$out/report-performance-status.json#Performance status" \
            "$out/report-performance.zip#Detailed performance report"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-performance
          path: .artifacts/performance
          if-no-files-found: error

      - name: Report a measured performance failure
        if: steps.measure.outputs.status != '0'
        run: exit 1

  manual:
    name: Documentation / Build handbook PDF and HTML
    if: needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, release-performance]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      LIGHT_MANUAL_VERSION: ${{ needs.release-metadata.outputs.version }}
      LIGHT_MANUAL_RENDERER_PACKAGE: "@tobisk/markdown-manuals@1.3.4"
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/help/.tooling/requirements.txt

      # Inline rather than the shared action: these jobs check out the released commit, which
      # predates it. Keeps package downloads from waiting forever on a silent mirror.
      - name: Tune package downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/99-tosklight-ci >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          CONF

      - name: Install manual rendering dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - run: npm run manual

      - name: Attach the handbook to the exact release
        run: |
          mkdir -p .artifacts/release
          cp .artifacts/generated/manual/pdf/tosklight-manual.pdf \
            .artifacts/release/assets-handbook.pdf
          gh release upload "$RELEASE_TAG" --clobber \
            ".artifacts/release/assets-handbook.pdf#Operator handbook"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-manual
          path: .artifacts/generated/manual
          if-no-files-found: error

  storybook-screenshots:
    name: Documentation / Storybook and static screenshots
    if: needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, release-performance]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      # Inline rather than the shared action: these jobs check out the released commit, which
      # predates it. Keeps package downloads from waiting forever on a silent mirror.
      - name: Tune package downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/99-tosklight-ci >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          CONF

      - name: Install Chrome for Playwright
        # The runner's package mirrors go silent for hours at a time. Killing a stalled attempt
        # and starting over costs minutes; waiting for one costs the whole job. The cap has to
        # leave room for all three attempts, or the first stall consumes it alone.
        timeout-minutes: 25
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chrome; then exit 0; fi
            echo "Chrome install attempt $attempt stalled; retrying."
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            # Playwright installs as root, so the kill above cannot reach its apt child. Clear it
            # out, or the next attempt waits on a lock nobody will release.
            sudo pkill -9 -x apt-get || true
          done
          exit 1

      - name: Build Storybook once and refresh its screenshot candidates
        run: bash tools/test.sh documentation-screenshots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-static
          path: .artifacts/build/storybook/ui
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: help-screenshots-storybook
          path: docs/help/assets/screenshots
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marketing-screenshots
          path: docs/marketing/assets/screenshots
          if-no-files-found: error

  help-live-build:
    name: Documentation / Build live screenshot application
    if: needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, release-performance]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: documentation-e2e-build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      # Inline rather than the shared action: these jobs check out the released commit, which
      # predates it. Keeps package downloads from waiting forever on a silent mirror.
      - name: Tune package downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/99-tosklight-ci >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          CONF

      - name: Install native build dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update \
              && sudo timeout 300 apt-get install -y libudev-dev libasound2-dev pkg-config; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1
      - run: bash tools/test.sh e2e-build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation-playwright-application
          path: .artifacts/build/cargo/debug/light-headless
          if-no-files-found: error

  help-live-screenshots:
    name: Documentation / Live-desk screenshot candidates
    if: needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, help-live-build]
    runs-on: ubuntu-22.04
    env:
      LIGHT_REUSE_E2E_BUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      # Inline rather than the shared action: these jobs check out the released commit, which
      # predates it. Keeps package downloads from waiting forever on a silent mirror.
      - name: Tune package downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/99-tosklight-ci >/dev/null <<'CONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::ForceIPv4 "true";
          CONF

      - name: Install Chrome for Playwright
        # The runner's package mirrors go silent for hours at a time. Killing a stalled attempt
        # and starting over costs minutes; waiting for one costs the whole job. The cap has to
        # leave room for all three attempts, or the first stall consumes it alone.
        timeout-minutes: 25
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chrome; then exit 0; fi
            echo "Chrome install attempt $attempt stalled; retrying."
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            # Playwright installs as root, so the kill above cannot reach its apt child. Clear it
            # out, or the next attempt waits on a lock nobody will release.
            sudo pkill -9 -x apt-get || true
          done
          exit 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation-playwright-application
          path: .artifacts/build/cargo/debug

      - run: chmod +x .artifacts/build/cargo/debug/light-headless
      - run: bash tools/test.sh help-screenshots-live

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: help-screenshots-live
          path: docs/help/assets/screenshots
          if-no-files-found: error

  help-screenshots:
    name: Documentation / Verify and publish refreshed Help screenshots
    if: needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, storybook-screenshots, help-live-screenshots]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: help-screenshots-storybook
          path: docs/help/assets/screenshots

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: help-screenshots-live
          path: docs/help/assets/screenshots

      - run: node tools/check-help-screenshot-set.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: help-screenshots
          path: docs/help/assets/screenshots
          if-no-files-found: error

      - name: Publish the refreshed Help gallery preview
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          MARKETING_SCREENSHOTS_S3_BUCKET: ${{ secrets.MARKETING_SCREENSHOTS_S3_BUCKET }}
          MARKETING_SCREENSHOTS_S3_BASE_PATH: ${{ secrets.MARKETING_SCREENSHOTS_S3_BASE_PATH }}
        run: bash tools/upload-help-screenshots.sh preview

  pages-build:
    name: Documentation / Build GitHub Pages
    if: needs.release-metadata.outputs.run == 'true'
    needs:
      - release-metadata
      - release-performance
      - manual
      - storybook-screenshots
      - help-screenshots
    runs-on: ubuntu-22.04
    env:
      LIGHT_RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
      LIGHT_REUSE_MANUAL: "1"
      LIGHT_PERFORMANCE_STATUS_FILE: .artifacts/performance/status.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-metadata.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: operator-manual
          path: .artifacts/generated/manual

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: help-screenshots
          path: docs/help/assets/screenshots

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: marketing-screenshots
          path: docs/marketing/assets/screenshots

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: storybook-static
          path: .artifacts/build/storybook/ui

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-performance
          path: .artifacts/performance

      - run: npm run pages:generate

      - id: site
        run: echo "path=$(npm run --silent artifact-path -- pages)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.site.outputs.path }}

      - name: Publish the marketing gallery preview
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          MARKETING_SCREENSHOTS_S3_BUCKET: ${{ secrets.MARKETING_SCREENSHOTS_S3_BUCKET }}
          MARKETING_SCREENSHOTS_S3_BASE_PATH: ${{ secrets.MARKETING_SCREENSHOTS_S3_BASE_PATH }}
        run: bash tools/upload-marketing-screenshots.sh preview

  pages-deploy:
    name: Documentation / Deploy GitHub Pages
    if: needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, pages-build]
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  mark-documented:
    name: Documentation / Mark release complete
    if: needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, pages-deploy]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
      RELEASE_SHA: ${{ needs.release-metadata.outputs.sha }}
    steps:
      - name: Attach the durable documentation marker
        run: |
          mkdir -p .artifacts/documentation
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_SHA" \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $tag, commit: $commit, completedAt: $completed_at}' \
            > .artifacts/documentation/report-documentation.json
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            .artifacts/documentation/report-documentation.json

  publish-marketing:
    name: Documentation / Promote marketing preview
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.promote_marketing &&
      needs.release-metadata.outputs.run == 'true'
    needs: [release-metadata, pages-build]
    runs-on: ubuntu-22.04
    steps:
      - name: Promote the previewed gallery to the live prefix
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BUCKET: ${{ secrets.MARKETING_SCREENSHOTS_S3_BUCKET }}
          BASE_PATH: ${{ secrets.MARKETING_SCREENSHOTS_S3_BASE_PATH }}
        run: |
          set -euo pipefail
          base="s3://$BUCKET/${BASE_PATH#/}"
          aws s3 cp "$base/preview/" "$base/" --recursive --only-show-errors
