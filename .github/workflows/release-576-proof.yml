name: Unchanged 576 Linux intention proof
on:
  push:
    branches: [codex/tl775-intention-slots]
    paths:
      - .github/workflows/release-576-proof.yml
      - crates/light/domain/dynamics/src/**
      - crates/light/domain/engine/src/parallel.rs
      - crates/light/domain/engine/src/parallel/**
      - crates/light/domain/engine/Cargo.toml
      - crates/light/adapters/headless/src/runtime/output_scheduler/**
      - tools/desktop-performance-576-*.mjs
      - tools/run-desktop-performance-576-proof.mjs
      - apps/light-desktop/src/NativePackagedStageBenchmarkApp.tsx
      - apps/light-desktop/src/nativePackagedStage*.ts
      - apps/light-desktop/src/nativePackagedBenchmarkMode.ts
      - apps/light-desktop/src/platform/desktop/types.ts
      - apps/light-desktop/src-tauri/src/packaged_benchmark.rs
permissions:
  contents: read
concurrency:
  group: linux-576-proof-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  linux-576:
    if: github.repository == 'kellertobias/tosklight'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      TARGET: x86_64-unknown-linux-gnu
      OUT: .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          key: tl775-linux576
          workspaces: . -> .artifacts/build/cargo
          cache-workspace-crates: false
          cache-on-failure: true
      - uses: ./.github/actions/package-mirror
      - name: Install canonical Linux bundle dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get update
          sudo timeout 900 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libudev-dev libasound2-dev libxdo-dev libxkbcommon-x11-0 mesa-vulkan-drivers vulkan-tools build-essential xvfb libgl1-mesa-dri
      - name: Verify source and observer tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$OUT/public"
          # This final default-policy proof requires the reviewed guest topology.
          # Fail on a different target; never force a worker override to imitate it.
          python3 - <<'PYTHON'
          import os,pathlib
          assert 'LIGHT_OUTPUT_WORKERS' not in os.environ, 'default proof must not override workers'
          allowed=sorted(os.sched_getaffinity(0))
          assert len(allowed)==4, 'default proof requires four allowed logical CPUs'
          cores=set()
          for cpu in allowed:
              location=pathlib.Path(f'/sys/devices/system/cpu/cpu{cpu}/topology')
              package=int((location/'physical_package_id').read_text().strip())
              core=int((location/'core_id').read_text().strip())
              assert 0<=package<=2147483647 and 0<=core<=2147483647, 'unsupported guest topology IDs'
              cores.add((package,core))
          assert len(cores)==2, 'default proof requires two guest topology cores'
          PYTHON
          npm ci >"$OUT/npm-ci.log" 2>&1
          node --test tools/desktop-performance-576-proof-observers.test.mjs tools/desktop-performance-576-phases.test.mjs tools/desktop-performance-576-tick-trace.test.mjs tools/desktop-performance-576-clock.test.mjs tools/desktop-performance-576-cpu.test.mjs tools/desktop-performance-576-workers.test.mjs tools/desktop-performance-576-pool.test.mjs
          cargo test --locked -p light-dynamics --lib
          cargo test --locked -p light-engine --lib parallel
      - name: Build exact canonical release Control and sidecars
        run: |
          set -euo pipefail
          npm run build --prefix apps/light-desktop >"$OUT/frontend-build.log" 2>&1
          cargo build --release --locked --target "$TARGET" -p light-headless --bin light-headless -p viz-renderer --bin viz-renderer >"$OUT/sidecar-build.log" 2>&1
          sidecars="$(npm run --silent artifact-path -- tmp)/linux-576-sidecars"
          mkdir -p "$sidecars"
          cp ".artifacts/build/cargo/$TARGET/release/light-headless" "$sidecars/light-headless-$TARGET"
          cp ".artifacts/build/cargo/$TARGET/release/viz-renderer" "$sidecars/viz-renderer-$TARGET"
          export LIGHT_DESKTOP_SIDECAR_DIR="$sidecars"
          export LIGHT_DESKTOP_SIDECAR_TARGET="$TARGET"
          config="$(npm run --silent artifact-path -- tmp)/linux-576-control.json"
          node tools/write-tauri-artifact-config.mjs control "$config"
          npm run --prefix apps/light-desktop tauri:build -- --target "$TARGET" --config "$config" --bundles appimage >"$OUT/control-build.log" 2>&1
          git diff --exit-code
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, subprocess
          root=pathlib.Path('.artifacts/build/cargo')/os.environ['TARGET']/'release'
          apps=list((root/'bundle/appimage').glob('*.AppImage'))
          assert len(apps)==1
          sources=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          # Guest-reported topology for allowed logical CPUs, not physical-host topology.
          topology={'allowed_topology_available':0,'allowed_topology_core_count':0,'allowed_topology_package_count':0}
          try:
              allowed=sorted(os.sched_getaffinity(0))
              entries=[]
              for cpu in allowed:
                  location=pathlib.Path(f'/sys/devices/system/cpu/cpu{cpu}/topology')
                  package=int((location/'physical_package_id').read_text().strip())
                  core=int((location/'core_id').read_text().strip())
                  if package < 0 or core < 0: raise ValueError('unavailable guest topology')
                  entries.append((package,core))
              if not entries: raise ValueError('empty allowed CPU topology')
              topology={'allowed_topology_available':1,'allowed_topology_core_count':len(set(entries)),'allowed_topology_package_count':len({package for package,_ in entries})}
          except (OSError,ValueError):
              pass
          proof={'source_commit':os.environ['CANDIDATE_SHA'],'workflow_commit':os.environ['GITHUB_SHA'],
                 'platform':platform.platform(),'cpu_count':os.cpu_count(),'allowed_cpu_count':len(os.sched_getaffinity(0)),**topology,
                 'benchmark_modes':['control_without_stage','stage_functional'],'expected_default_workers':2,'default_worker_override_absent':int('LIGHT_OUTPUT_WORKERS' not in os.environ),'cpu_models':sorted({line.split(':',1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith('model name') and ':' in line}),
                 'rustc':subprocess.check_output(['rustc','-Vv'],text=True),
                 'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sources if p and pathlib.Path(p).is_file()},
                 'binaries':{p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in [apps[0],root/'light-headless',root/'viz-renderer']}}
          assert proof['default_worker_override_absent']==1 and proof['allowed_cpu_count']==4 and proof['allowed_topology_available']==1 and proof['allowed_topology_core_count']==2
          assert proof['source_sha256'] and len(proof['source_sha256']) == sum(bool(p) and pathlib.Path(p).is_file() for p in sources)
          (pathlib.Path(os.environ['OUT'])/'public'/'provenance.json').write_text(json.dumps(proof,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'PROOF_APPIMAGE={apps[0].resolve()}\n')
          PYTHON
      - name: Prove default-policy 40 Hz Control without Stage on unchanged 576 workload
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          LIGHT_OUTPUT_PHASE_DIAGNOSTICS: 'true'
          LIGHT_OUTPUT_WORKER_PROOF_EXPECTED: '2'
        run: |
          set -euo pipefail
          test "${LIGHT_OUTPUT_WORKERS+x}" != x
          private="$(npm run --silent artifact-path -- tmp)/linux-576-${{ github.run_id }}-${{ github.run_attempt }}-control"
          directory="$OUT/public/control"
          mkdir -p "$directory"
          set +e
          timeout 480 xvfb-run -a node tools/run-desktop-performance-576-proof.mjs --mode control --application "$PROOF_APPIMAGE" --output-dir "$private" --demo-show assets/demo.show --numeric-report "$directory/desktop-576-proof-numeric.json" >"$OUT/control.stdout.log" 2>"$OUT/control.stderr.log"
          proof_status=$?
          node --input-type=module - "$directory" <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { validateNumericProof } from './tools/desktop-performance-576-proof-observers.mjs';
          import { validatePhaseDiagnostics } from './tools/desktop-performance-576-phases.mjs';
          import { validateWorkerDiagnostics } from './tools/desktop-performance-576-workers.mjs';
          const directory = process.argv[2];
          assert.equal(process.env.LIGHT_OUTPUT_WORKERS, undefined);
          assert.equal(process.env.LIGHT_OUTPUT_WORKER_PROOF_EXPECTED, '2');
          const receipt = validateWorkerDiagnostics(JSON.parse(await readFile(`${directory}/worker-numeric.json`, 'utf8')));
          assert.equal(receipt.expected_workers, 2);
          for (const name of ['available','capture_complete']) assert.equal(receipt[name], 1, name);
          assert.equal(receipt.observations, 2);
          assert.equal(receipt.valid_observations, 2);
          assert.equal(receipt.failure_code, 0);
          const proof = validateNumericProof(JSON.parse(await readFile(`${directory}/desktop-576-proof-numeric.json`, 'utf8')));
          assert.equal(proof.proof_mode_code, 1);
          assert.equal(proof.counter_observations, 61);
          assert.equal(proof.interval_count, 60);
          assert.equal(proof.complete, 1);
          assert.equal(proof.all_gates_passed, 1);
          validatePhaseDiagnostics(JSON.parse(await readFile(`${directory}/phase-numeric.json`, 'utf8')));
          JAVASCRIPT
          validation_status=$?
          set -e
          printf 'proof_exit=%s validation_exit=%s\n' "$proof_status" "$validation_status" >"$OUT/control-default-status.log"
          test "$proof_status" -eq 0
          test "$validation_status" -eq 0
      - name: Verify default-policy software-rendered Stage functionality on unchanged 576 workload
        if: ${{ !cancelled() && env.PROOF_APPIMAGE != '' }}
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          LIGHT_OUTPUT_PHASE_DIAGNOSTICS: 'true'
          LIGHT_OUTPUT_WORKER_PROOF_EXPECTED: '2'
        run: |
          set -euo pipefail
          test "${LIGHT_OUTPUT_WORKERS+x}" != x
          private="$(npm run --silent artifact-path -- tmp)/linux-576-${{ github.run_id }}-${{ github.run_attempt }}-stage"
          directory="$OUT/public/stage"
          mkdir -p "$directory"
          set +e
          timeout 480 xvfb-run -a node tools/run-desktop-performance-576-proof.mjs --mode stage --application "$PROOF_APPIMAGE" --output-dir "$private" --demo-show assets/demo.show --numeric-report "$directory/desktop-576-proof-numeric.json" >"$OUT/stage.stdout.log" 2>"$OUT/stage.stderr.log"
          proof_status=$?
          node --input-type=module - "$directory" <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { validateNumericProof } from './tools/desktop-performance-576-proof-observers.mjs';
          import { validatePhaseDiagnostics } from './tools/desktop-performance-576-phases.mjs';
          import { validateWorkerDiagnostics } from './tools/desktop-performance-576-workers.mjs';
          const directory = process.argv[2];
          assert.equal(process.env.LIGHT_OUTPUT_WORKERS, undefined);
          assert.equal(process.env.LIGHT_OUTPUT_WORKER_PROOF_EXPECTED, '2');
          const receipt = validateWorkerDiagnostics(JSON.parse(await readFile(`${directory}/worker-numeric.json`, 'utf8')));
          assert.equal(receipt.expected_workers, 2);
          for (const name of ['available','capture_complete']) assert.equal(receipt[name], 1, name);
          assert.equal(receipt.observations, 2);
          assert.equal(receipt.valid_observations, 2);
          assert.equal(receipt.failure_code, 0);
          const proof = validateNumericProof(JSON.parse(await readFile(`${directory}/desktop-576-proof-numeric.json`, 'utf8')));
          assert.equal(proof.proof_mode_code, 2);
          assert.equal(proof.counter_observations, 61);
          assert.equal(proof.interval_count, 60);
          assert.equal(proof.complete, 1);
          assert.equal(proof.all_gates_passed, 1);
          validatePhaseDiagnostics(JSON.parse(await readFile(`${directory}/phase-numeric.json`, 'utf8')));
          JAVASCRIPT
          validation_status=$?
          set -e
          printf 'proof_exit=%s validation_exit=%s\n' "$proof_status" "$validation_status" >"$OUT/stage-default-status.log"
          test "$proof_status" -eq 0
          test "$validation_status" -eq 0
      - name: Trace default-policy Control pool coordination on unchanged 576 workload
        if: ${{ !cancelled() && env.PROOF_APPIMAGE != '' }}
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          LIGHT_OUTPUT_PHASE_DIAGNOSTICS: all
          LIGHT_OUTPUT_WORKER_PROOF_EXPECTED: '2'
          RUST_LOG: light_headless_runtime=info,light_output=info,light_engine=info,tower_http=info
        run: |
          set -euo pipefail
          test "${LIGHT_OUTPUT_WORKERS+x}" != x
          private="$(npm run --silent artifact-path -- tmp)/linux-576-${{ github.run_id }}-${{ github.run_attempt }}-trace"
          directory="$OUT/public/trace"
          mkdir -p "$directory"
          # Full tracing adds observer work; this separate run supplies attribution.
          # Original Control acceptance and Stage functional gates above stay unchanged.
          set +e
          timeout 480 xvfb-run -a node tools/run-desktop-performance-576-proof.mjs --mode control --application "$PROOF_APPIMAGE" --output-dir "$private" --demo-show assets/demo.show --numeric-report "$directory/desktop-576-proof-numeric.json" >"$OUT/trace.stdout.log" 2>"$OUT/trace.stderr.log"
          trace_status=$?
          set -e
          test "$trace_status" -le 1
          node --input-type=module - "$directory" <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { validateNumericProof } from './tools/desktop-performance-576-proof-observers.mjs';
          import { validateTickTraceDiagnostics } from './tools/desktop-performance-576-tick-trace.mjs';
          import { validateCpuDiagnostics } from './tools/desktop-performance-576-cpu.mjs';
          import { validatePoolDiagnostics } from './tools/desktop-performance-576-pool.mjs';
          import { validateWorkerDiagnostics } from './tools/desktop-performance-576-workers.mjs';
          const directory = process.argv[2];
          const read = async name => JSON.parse(await readFile(`${directory}/${name}`, 'utf8'));
          const proof = validateNumericProof(await read('desktop-576-proof-numeric.json'));
          assert.equal(proof.proof_mode_code, 1);
          for (const name of ['complete','workload_available','measurement_available','udp_integrity_passed','interaction_passed','sheet_liveness_passed','stage_absence_passed','cleanup_complete']) assert.equal(proof[name], 1, name);
          assert.equal(proof.send_errors, 0);
          const receipt = validateWorkerDiagnostics(await read('worker-numeric.json'));
          assert.equal(receipt.expected_workers, 2);
          for (const name of ['available','capture_complete']) assert.equal(receipt[name], 1, name);
          assert.equal(receipt.valid_observations, 2);
          const trace = validateTickTraceDiagnostics(await read('tick-trace-numeric.json'));
          for (const name of ['available','capture_complete','parse_complete','join_complete','health_deadline_comparison_available','completed_frames_comparison_available']) assert.equal(trace[name], 1, name);
          assert(Math.abs(trace.completed_frame_delta) <= 1);
          assert(Math.abs(trace.health_deadline_delta) <= 1);
          const cpu = validateCpuDiagnostics(await read('cpu-numeric.json'));
          for (const name of ['available','capture_complete','parse_complete','join_complete','cpu_complete','cpu_available']) assert.equal(cpu[name], 1, name);
          const pool = validatePoolDiagnostics(await read('pool-numeric.json'));
          for (const name of ['available','capture_complete','parse_complete','join_complete']) assert.equal(pool[name], 1, name);
          JAVASCRIPT
      - name: Publish closed numeric proof only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-576-numeric-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/provenance.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/control/desktop-576-proof-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/control/phase-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/control/worker-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/stage/desktop-576-proof-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/stage/phase-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/stage/worker-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/trace/desktop-576-proof-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/trace/phase-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/trace/worker-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/trace/tick-trace-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/trace/cpu-numeric.json
            .artifacts/test/results/linux-576-${{ github.run_id }}-${{ github.run_attempt }}/public/trace/pool-numeric.json
          if-no-files-found: error
