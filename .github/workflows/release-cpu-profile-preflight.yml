name: Release CPU profile capability (synthetic only)

# No application build, show workload, release publication or performance gate.
on:
  push:
    branches: [codex/release-output-cohort-diagnostics]
    paths:
      - .github/workflows/release-cpu-profile-preflight.yml
      - tools/desktop-performance-profile.py
      - tools/desktop-performance-profile.test.py

permissions:
  contents: read

concurrency:
  group: cpu-profile-preflight-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  synthetic-capability:
    if: github.repository == 'kellertobias/tosklight'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Freeze source and public artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -B - <<'PYTHON'
          import hashlib, json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from artifact_paths import artifact_path
          out = artifact_path('LIGHT_TEST_RESULTS_DIR', 'TEST_RESULTS') / f"tl775-cpu-preflight-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          out.mkdir(parents=True, exist_ok=False)
          temporary = artifact_path('LIGHT_TMP_DIR', 'TMP_ROOT')
          temporary.mkdir(parents=True, exist_ok=True)
          paths = ['.github/workflows/release-cpu-profile-preflight.yml',
                   'tools/desktop-performance-profile.py', 'tools/desktop-performance-profile.test.py',
                   'tools/artifact_paths.py', 'tools/artifact-layout.conf']
          manifest = {'source_sha': os.environ['EXPECTED_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'purpose': 'PUBLIC synthetic CPU-stack capability only; not application/performance acceptance',
                      'build_or_cohorts_requested': False, 'preflight_global_seconds': 50,
                      'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}}
          (out / 'source-workflow.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PROFILE_PREFLIGHT_OUT={out}\n')
              stream.write(f'TMPDIR={temporary}\n')
          PYTHON

      - name: Pure and mocked helper checks before tool setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/desktop-performance-profile.test.py \
            2>&1 | tee "$PROFILE_PREFLIGHT_OUT/pure-tests.log"

      - name: Provide official Linux tools within five minutes
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, shutil, subprocess, time
          manifest_path = pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT']) / 'source-workflow.json'
          manifest = json.loads(manifest_path.read_text())
          deadline = time.monotonic() + 280
          audit = {'kernel': platform.release(), 'architecture': platform.machine(),
                   'attempts': [], 'setup_attempted': False, 'capability': 'NOT RUN'}
          manifest['tool_availability'] = audit
          def save():
              manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          def query(args):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError('tool discovery deadline exceeded')
              return subprocess.run(args, text=True, capture_output=True, timeout=min(2, remaining))
          def canonical_packages(canonical, owned, query, owner_checks):
              if canonical in owned:
                  return owned[canonical]
              lookup = query(['dpkg-query', '-S', canonical])
              check = {'canonical': canonical, 'owner_query_exit': lookup.returncode, 'owners': []}
              owner_checks.append(check)
              if lookup.returncode:
                  return []
              accepted = []
              for line in lookup.stdout.splitlines():
                  package, separator, path = line.partition(': ')
                  if not separator or path != canonical:
                      continue
                  status = query(['dpkg-query', '-W', '-f=${db:Status-Abbrev}\n', package])
                  files = query(['dpkg-query', '-L', package])
                  installed = status.returncode == 0 and status.stdout.startswith('ii')
                  exact_file = files.returncode == 0 and canonical in files.stdout.splitlines()
                  check['owners'].append({'package': package, 'installed': installed, 'exact_file_list': exact_file})
                  if installed and exact_file:
                      accepted.append(package)
              return accepted
          def discover():
              result = {'cc': shutil.which('cc'), 'readelf': shutil.which('readelf'),
                        'packages': [], 'perf_paths': [], 'canonical_owner_checks': [], 'candidates': []}
              audit['attempts'].append(result)
              listing = query(['dpkg-query', '-W', '-f=${binary:Package}\t${db:Status-Abbrev}\n', 'linux-tools-*'])
              result['package_query_exit'] = listing.returncode
              owned = {}
              for line in listing.stdout.splitlines():
                  package, status = line.split('\t', 1)
                  row = {'package': package, 'status': status}
                  result['packages'].append(row)
                  if not status.startswith('ii'):
                      continue
                  files = query(['dpkg-query', '-L', package])
                  row['files_query_exit'] = files.returncode
                  if files.returncode:
                      continue
                  for raw in files.stdout.splitlines():
                      if raw.startswith('/'):
                          owned.setdefault(raw, []).append(package)
              for raw, packages in sorted(owned.items()):
                  path = pathlib.Path(raw)
                  if path.name != 'perf':
                      continue
                  row = {'path': raw, 'packages': packages, 'symlink': path.is_symlink()}
                  result['perf_paths'].append(row)
                  try:
                      canonical = path.resolve(strict=True)
                      row['canonical'] = str(canonical)
                      owners = canonical_packages(str(canonical), owned, query, result['canonical_owner_checks'])
                      if not owners:
                          row['rejected'] = 'canonical target has no installed package owner with exact file-list membership'
                      elif not canonical.is_file() or not os.access(canonical, os.X_OK):
                          row['rejected'] = 'canonical target not an executable regular file'
                      else:
                          with canonical.open('rb') as stream:
                              magic = stream.read(4)
                          row['magic_hex'] = magic.hex()
                          if magic != b'\x7fELF':
                              row['rejected'] = 'not a direct ELF (wrapper or other format)'
                          else:
                              result['candidates'].append({'path': str(canonical), 'packages': owners,
                                  'via': raw, 'sha256': hashlib.sha256(canonical.read_bytes()).hexdigest()})
                  except (OSError, RuntimeError) as error:
                      row['rejected'] = type(error).__name__
              save()
              return result
          try:
              release = pathlib.Path('/etc/os-release')
              if release.exists():
                  audit['os_release'] = {key: value.strip('"') for key, value in
                      (line.split('=', 1) for line in release.read_text().splitlines() if '=' in line)
                      if key in ('ID', 'VERSION_ID', 'NAME')}
              current = discover()
              if not current['candidates'] or not current['cc'] or not current['readelf']:
                  # One official package setup, no policy/sysctl/capability changes.
                  if deadline - time.monotonic() < 255:
                      raise TimeoutError('insufficient bounded setup budget; no installer started')
                  audit['setup_attempted'] = True
                  save()
                  setup = subprocess.run(['sudo', '-n', 'timeout', '--signal=TERM', '--kill-after=10s', '240s',
                      'env', 'DEBIAN_FRONTEND=noninteractive', 'NEEDRESTART_MODE=a', 'bash', '-c',
                      'set -e; apt-get update; apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic binutils build-essential'],
                      timeout=255)
                  audit['setup_exit'] = setup.returncode
                  save()
                  current = discover()
              if not current['candidates'] or not current['cc'] or not current['readelf']:
                  raise RuntimeError('official direct perf ELF/compiler/binutils unavailable')
              current['candidates'].sort(key=lambda item: (audit['kernel'] in item['via'] or audit['kernel'] in item['path'], item['path']))
              selected = current['candidates'][-1]
              manifest['tool_selection'] = {**selected, 'kernel': audit['kernel'],
                  'kernel_match': audit['kernel'] in selected['via'] or audit['kernel'] in selected['path'],
                  'selection': 'installed package-listed canonical ELF; exact kernel preferred; capability unproved'}
              audit['status'] = 'TOOLS_AVAILABLE_CAPABILITY_UNPROVED'
              save()
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write(f"LIGHT_PERF_ELF={selected['path']}\n")
          except (OSError, ValueError, RuntimeError, TimeoutError, subprocess.SubprocessError) as error:
              audit['status'] = 'STOP'
              audit['error'] = str(error)
              save()
              raise SystemExit('STOP: tool availability failed; see source-workflow.json; no probe/build/cohorts')
          PYTHON

      - name: One bounded synthetic capability preflight
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # External 60+8s containment leaves the helper's reviewed shared50s cleanup budget.
          # The helper alone may use one permission-denied-only sudo-n attempt. STOP is failure.
          timeout --signal=TERM --kill-after=8s 60s python3 -B \
            tools/desktop-performance-profile.py preflight \
            --output "$PROFILE_PREFLIGHT_OUT/preflight.json"

      - name: Preserve an explicit STOP when capability did not complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PROFILE_PREFLIGHT_OUT:-}" ]]; then
            python3 -B - <<'PYTHON'
          import json, os, pathlib
          path = pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT']) / 'preflight.json'
          if not path.exists():
              path.write_text(json.dumps({'status': 'STOP', 'canonical_build_allowed': False,
                  'code': 'preflight_or_prior_step_incomplete',
                  'qualification': 'No completed capability receipt; no application build or cohort requested; actor cleanup not inferred'}) + '\n')
          PYTHON
          fi

      - name: Retain public safe receipts only
        if: always() && env.PROFILE_PREFLIGHT_OUT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tl775-cpu-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROFILE_PREFLIGHT_OUT }}/preflight.json
            ${{ env.PROFILE_PREFLIGHT_OUT }}/source-workflow.json
            ${{ env.PROFILE_PREFLIGHT_OUT }}/pure-tests.log
          if-no-files-found: error
