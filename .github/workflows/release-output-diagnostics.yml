name: Release output diagnostics (artifact only)

# Diagnostic orchestration does not build, tag or publish a release. The binary source is pinned
# independently of this workflow commit, using the reviewed current release source.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Reviewed instrumented source commit (exact 40-character SHA)
        required: true
        type: string
      worker_comparison:
        description: Compare requested output worker counts 1 then 4 on the same host and binaries
        required: false
        default: false
        type: boolean

      headless_stacks:
        description: One OFF576 cohort with bounded 49 Hz existing-thread headless stacks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: output-diagnostics-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  HEADLESS_STACKS: ${{ inputs.headless_stacks && '1' || '0' }}
  WORKER_COMPARISON: ${{ inputs.worker_comparison && '1' || '0' }}

jobs:
  candidate-desktop:
    name: Candidate / Unchanged 576-fixture diagnostic cohorts
    if: github.repository == 'kellertobias/tosklight'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OUT: .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Freeze actual source and host identity
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$HEADLESS_STACKS" == 1 ]]; then test "$WORKER_COMPARISON" = 0; fi
          mkdir -p "$OUT"
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, subprocess
          def command(*args):
              return subprocess.check_output(args, text=True).strip()
          paths = ['Cargo.lock', 'package-lock.json', 'assets/demo.show',
                   'tools/run-desktop-performance.mjs', 'tools/process-tree-resources.mjs',
                   'tools/desktop-performance-cpu-stages.mjs',
                   'tools/desktop-performance-headless-stacks.mjs',
                   'tools/desktop-performance-headless-stacks.test.mjs',
                   'tools/desktop-performance-headless-stacks-recorder.mjs',
                   'tools/desktop-performance-headless-stacks-recorder.test.mjs',
                   'tools/desktop-performance-headless-stack-coverage.mjs',
                   'tools/desktop-performance-headless-stack-coverage.test.mjs',
                   'tools/desktop-performance-cpu-workload.mjs',
                   'tools/desktop-performance-cpu-cadence.test.mjs',
                   'apps/viz-renderer/src/embedded.rs', 'apps/viz-renderer/src/embedded/cpu_diagnostics.rs',
                   'crates/viz/helper/src/lib.rs', 'crates/viz/helper/src/cpu_diagnostics.rs',
                   'crates/viz/render/src/renderer/frame.rs',
                   'crates/light/adapters/headless/src/runtime/output_scheduler/typed_cpu.rs']
          paths += ['apps/light-headless/src/bin/light_benchmark/patch_mutation.rs', 'apps/light-headless/src/bin/light_benchmark/patch_mutation/diagnostics.rs', 'crates/shared/show/src/playback_contract.rs', 'crates/shared/show/src/show_store.rs', 'crates/shared/show/src/portable/migration.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/dynamic_projection.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/dynamic_projection/output_transaction.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/dynamic_projection/output_transaction/family_frame.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/dynamic_projection/programming_projection/hybrid.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/dynamic_projection/programming_projection/hybrid/parallel_groups.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/dynamic_projection/programming_projection/hybrid/parallel_preparation.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/dynamic_projection/programming_projection/hybrid/staged.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/slow_phase_trace.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/slow_phase_trace/live_phases.rs', 'crates/light/adapters/headless/src/runtime/output_scheduler/slow_phase_trace/live_phases/family_preparation.rs']
          data = {'binary_source_sha': os.environ['CANDIDATE_SHA'],
                  'workflow_commit_sha': os.environ['WORKFLOW_SHA'],
                  'qualification': ('One existing OFF576 cohort with 49Hz existing-thread headless sampling; overhead present; no per-frame join or release acceptance.' if os.environ['HEADLESS_STACKS'] == '1' else 'One diagnostic pair by default; optional same-host worker comparison runs two ordered pairs. Original workloads and gates retained. No release acceptance, pane binding or accepted-frame attribution.'),
                  'platform': platform.platform(), 'cpu_count': os.cpu_count(),
                  'allowed_cpus': sorted(os.sched_getaffinity(0)),
                  'baseline_source_sha': '0f37830ffe7fcea054280332c1c91278dcae4a16',
                  'node': command('node', '--version'), 'rustc': command('rustc', '-Vv'),
                  'cargo': command('cargo', '--version'),
                  'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
                  'pair_order': ['off'] if os.environ['HEADLESS_STACKS'] == '1' else ['off', 'on'], 'typed_cpu_opt_in': {'off': '0', 'on': '1'},
                  'requested_output_worker_sequence': [1, 4] if os.environ['WORKER_COMPARISON'] == '1' else None,
                  'worker_qualification': 'Requested startup environment only; no actual pool-size or worker CPU attribution. Same-host ordered cohorts retain warmup/order confounders.',
                  'observer_caveat': 'Sequential paired cohorts on one host; order and process warmup are confounders. Inclusive wall time is not CPU or parked lock wait.'}
          path = pathlib.Path(os.environ['OUT']) / 'candidate-source-host.json'
          with path.open('x') as stream:
              json.dump(data, stream, indent=2)
              stream.write('\n')
          PYTHON

      - uses: ./.github/actions/package-mirror

      - name: Install canonical Linux bundle and measurement dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get update
          sudo timeout 900 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libudev-dev libasound2-dev \
            libxdo-dev libxkbcommon-x11-0 mesa-vulkan-drivers vulkan-tools \
            build-essential xvfb libgl1-mesa-dri

      - name: Preflight opt-in existing-thread headless sampling before expensive build
        if: inputs.headless_stacks
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 900 apt-get install -y linux-tools-generic binutils
          mapfile -t tools < <(find /usr/lib -maxdepth 3 -type f -path '*/linux-tools*/perf' | sort -V)
          perf=/usr/bin/perf
          if [[ "${#tools[@]}" -gt 0 ]]; then perf="${tools[-1]}"; fi
          mkdir -p "$OUT/off"
          preflight="$(node tools/desktop-performance-headless-stacks.mjs --preflight "$perf" "$(realpath "$OUT/off")")"
          printf 'HEADLESS_STACK_PREFLIGHT=%s\n' "$preflight" >> "$GITHUB_ENV"

      - name: Build pinned canonical release Control and sidecars
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$OUT/npm-ci.log"
          npm run build --prefix apps/light-desktop 2>&1 | tee "$OUT/frontend-build.log"
          cargo build --release --locked --target "$TARGET" \
            -p light-headless --bin light-headless -p viz-renderer --bin viz-renderer \
            2>&1 | tee "$OUT/sidecar-build.log"
          sidecars="$(npm run --silent artifact-path -- tmp)/tl775-diagnostic-sidecars"
          mkdir -p "$sidecars"
          cp ".artifacts/build/cargo/$TARGET/release/light-headless" "$sidecars/light-headless-$TARGET"
          cp ".artifacts/build/cargo/$TARGET/release/viz-renderer" "$sidecars/viz-renderer-$TARGET"
          export LIGHT_DESKTOP_SIDECAR_DIR="$sidecars"
          export LIGHT_DESKTOP_SIDECAR_TARGET="$TARGET"
          config="$(npm run --silent artifact-path -- tmp)/tl775-diagnostic-control.json"
          node tools/write-tauri-artifact-config.mjs control "$config"
          cp "$config" "$OUT/tauri-control-config.json"
          if [[ "$HEADLESS_STACKS" == 1 ]]; then export NO_STRIP=1; fi
          npm run --prefix apps/light-desktop tauri:build -- --target "$TARGET" \
            --config "$config" --bundles appimage 2>&1 | tee "$OUT/control-build.log"
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, stat, subprocess
          root = pathlib.Path('.artifacts/build/cargo') / os.environ['TARGET'] / 'release'
          apps = sorted((root / 'bundle/appimage').glob('*.AppImage'))
          if len(apps) != 1:
              raise RuntimeError(f'Expected exactly one canonical AppImage, got {apps}')
          paths = [apps[0], root / 'light-headless', root / 'viz-renderer']
          headless = root / 'light-headless'
          if os.environ['HEADLESS_STACKS'] == '1':
              result = subprocess.run(['node', 'tools/desktop-performance-headless-stacks.mjs',
                                       '--pin-packaged', str(apps[0].resolve())],
                                      capture_output=True, text=True, check=True, timeout=45)
              pin = json.loads(pathlib.Path(result.stdout.strip()).read_text())
              assert pin['schema'] == 1
              assert pin['appimage']['sha256'] == hashlib.sha256(apps[0].read_bytes()).hexdigest()
              packaged = pathlib.Path(pin['packaged']['path'])
              assert not packaged.is_symlink() and packaged.resolve() == packaged
              descriptor = os.open(packaged, os.O_RDONLY | os.O_NOFOLLOW)
              with os.fdopen(descriptor, 'rb') as stream:
                  identity = os.fstat(stream.fileno())
                  assert stat.S_ISREG(identity.st_mode) and identity.st_uid == os.getuid() and identity.st_nlink == 1
                  assert [str(identity.st_dev), str(identity.st_ino), str(identity.st_size)] == pin['packaged']['metadata'].split(':')[:3]
                  payload = stream.read()
                  after = os.fstat(stream.fileno())
                  assert (identity.st_dev, identity.st_ino, identity.st_size, identity.st_mtime_ns, identity.st_ctime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
              named = packaged.lstat()
              assert not packaged.is_symlink() and (named.st_dev, named.st_ino, named.st_size, named.st_mtime_ns, named.st_ctime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
              assert hashlib.sha256(payload).hexdigest() == pin['packaged']['sha256']
              headless = root / 'tl775-packaged-light-headless'
              with headless.open('xb') as stream:
                  stream.write(payload)
              headless.chmod(0o600)
              assert hashlib.sha256(headless.read_bytes()).hexdigest() == pin['packaged']['sha256']
              paths.append(headless)
          data = {'source_sha': os.environ['CANDIDATE_SHA'],
                  'binaries': [{'path': str(p), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                                'size_bytes': p.stat().st_size} for p in paths]}
          out = pathlib.Path(os.environ['OUT'])
          with (out / 'candidate-binaries.json').open('x') as stream:
              json.dump(data, stream, indent=2)
              stream.write('\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'DIAGNOSTIC_APPIMAGE={apps[0].resolve()}\n')
              stream.write(f'DIAGNOSTIC_HEADLESS={headless.resolve()}\n')
          PYTHON

      - name: Measure unchanged 576-fixture case OFF then ON for each requested worker setting
        id: measure
        shell: bash
        env:
          RUST_LOG: info
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          set -euo pipefail
          overall=0
          workers=default
          if [[ "$WORKER_COMPARISON" == 1 ]]; then workers="1 4"; fi
          observers="off on"
          if [[ "$HEADLESS_STACKS" == 1 ]]; then observers=off; fi
          for worker in $workers; do
            cohort="$OUT"
            if [[ "$worker" != default ]]; then cohort="$OUT/workers-$worker"; fi
            for observer in $observers; do
            # Verify the same pinned source and exact binaries before both sequential cohorts.
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
            python3 - <<'PYTHON'
          import hashlib, json, os, pathlib
          data = json.loads((pathlib.Path(os.environ['OUT']) / 'candidate-binaries.json').read_text())
          assert data['source_sha'] == os.environ['CANDIDATE_SHA']
          for entry in data['binaries']:
              assert hashlib.sha256(pathlib.Path(entry['path']).read_bytes()).hexdigest() == entry['sha256']
          PYTHON
            mkdir -p "$cohort/$observer"
            # A requested count affects scheduling only, never the fixture workload or gates.
            if [[ "$worker" != default ]]; then export LIGHT_OUTPUT_WORKERS="$worker"; fi
            stack_arguments=()
            if [[ "$HEADLESS_STACKS" == 1 ]]; then
              stack_arguments=(--headless-stacks on --headless-stack-preflight "$HEADLESS_STACK_PREFLIGHT" --headless-stack-binary "$DIAGNOSTIC_HEADLESS")
            fi
            status=0
            xvfb-run -a node tools/run-desktop-performance.mjs \
              --application "$DIAGNOSTIC_APPIMAGE" --output-dir "$cohort/$observer" \
              --demo-show assets/demo.show --typed-cpu-diagnostics "$observer" "${stack_arguments[@]}" \
              >"$cohort/$observer/collector.stdout.log" \
              2>"$cohort/$observer/collector.stderr.log" || status=$?
            printf '%s\n' "$status" >"$cohort/$observer/collector-exit-code.txt"
            if [[ "$status" != 0 ]]; then overall=1; fi
            done
          done
          # A later cohort cannot erase any earlier workload or validation failure.
          # An ON success cannot erase an OFF workload or validation failure. No retries.
          exit "$overall"

      - name: Publish only reviewed provenance and validated numeric reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tl775-typed-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/candidate-source-host.json
            .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/candidate-binaries.json
            .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/off/headless-stacks-numeric.json
            .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/off/typed-cpu-numeric.json
            .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/on/typed-cpu-numeric.json
            .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/workers-*/off/typed-cpu-numeric.json
            .artifacts/test/results/tl775-output-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}/workers-*/on/typed-cpu-numeric.json
          if-no-files-found: error
