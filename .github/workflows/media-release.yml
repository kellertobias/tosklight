name: Media release components

# Called by the main release pipeline immediately after version selection. Media remains a
# separate product and build matrix, but no longer waits for an already-published core release.
# The caller assembles these platform components with Desk, Headless, and PreViz only after every
# required quality gate succeeds.
on:
  workflow_call:
    inputs:
      version:
        description: Semantic release version selected by the caller
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Media component / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            binary: media-server
          - label: Linux (x86_64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-amd64
            binary: media-server
          - label: Linux (ARM64)
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            binary: media-server
          - label: Windows (x86_64)
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-amd64
            binary: media-server.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: media-release-${{ matrix.target }}

      - name: Install the Linux audio development files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the administration interface
        run: npm run build --prefix apps/media

      - name: Build the Media Server
        shell: bash
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p media-server --bin media-server

      - name: Smoke-test the built server
        shell: bash
        env:
          BINARY: .artifacts/build/cargo/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          set -euo pipefail
          "$BINARY" --check-configuration

      - name: Stage the independently built component
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          out=".artifacts/release"
          source tools/artifact-paths.sh
          light_init_artifact_paths "$PWD"
          mkdir -p "$out" "$LIGHT_TMP_DIR"
          stage_root="$(mktemp -d "$LIGHT_TMP_DIR/media-component.XXXXXX")"
          trap 'rm -rf -- "$stage_root"' EXIT
          stage="$stage_root/tosklight-media-$VERSION-$SLUG"
          mkdir -p "$stage"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash tools/bundle-media-macos.sh \
              ".artifacts/build/cargo/$TARGET/release/$BINARY" "$stage" "$VERSION"
            bash tools/seal-macos-app.sh "$stage/ToskLight Media.app"
          else
            cp ".artifacts/build/cargo/$TARGET/release/$BINARY" "$stage/"
          fi
          archive="tosklight-media-$VERSION-$SLUG.zip"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$stage_root" && 7z a -tzip "$OLDPWD/$out/$archive" "$(basename "$stage")")
          else
            (cd "$stage_root" && zip -q -r "$OLDPWD/$out/$archive" "$(basename "$stage")")
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: component-media-${{ matrix.slug }}
          path: .artifacts/release/*
          if-no-files-found: error
