name: Media release

# The Media Server is a separate product, but every published ToskLight version has a complete,
# predictable download matrix. This workflow follows a successful release pipeline, builds Media
# for every supported target, and attaches those archives to the release that run just published.
# Keeping the build in a follow-up preserves the product boundary without leaving current-version
# Pages links pointing at assets that were skipped because Media happened not to change.

on:
  workflow_run:
    workflows: ["CI, release, and Pages"]
    types: [completed]
  # Building the archives without publishing them, for anyone checking that packaging still works.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  decide:
    name: Media release / Decide
    # Only a successful release run of `main` can have published a release to attach to. A manual
    # dispatch builds without publishing, which is why it is allowed through too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve the release version and publication mode
        id: decide
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          # A successful pipeline run does not necessarily mean a release: a run whose commits were
          # all `chore` or `docs` publishes nothing, and there is then nothing to attach to.
          tag="$(git tag --points-at "$HEAD_SHA" --list 'v[0-9]*' | sort -V | tail -1)"
          if [[ -z "$tag" ]]; then
            if [[ "$DISPATCHED" != "true" ]]; then
              echo "That run published no release; there is nothing to attach Media to."
              {
                echo "build=false"
                echo "publish=false"
                echo "version="
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A dispatch builds whatever is checked out, against the newest known version.
            tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
          fi

          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$([[ "$DISPATCHED" == "true" ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Media release / ${{ matrix.label }}
    needs: [decide]
    if: needs.decide.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The supported matrix from the settled decision: macOS on Apple Silicon, Windows on
        # x86_64, and Linux on both x86_64 and aarch64. Each is built on its own architecture
        # rather than cross-compiled, because the Media Server links a platform audio host and a
        # GPU backend and a native build is what the CI gate already proves.
        include:
          - label: macOS (Apple Silicon)
            runner: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            binary: media-server
          - label: Linux (x86_64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-amd64
            binary: media-server
          - label: Linux (ARM64)
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            binary: media-server
          - label: Windows (x86_64)
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-amd64
            binary: media-server.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: media-release-${{ matrix.target }}

      # Audio capture needs ALSA's headers to build at all. The machine genuinely lacking them is
      # not a platform adapter left unwritten, so the runner is given them.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install workspace dependencies
        run: npm ci

      # The administration interface is compiled into the executable, so it is built first. What
      # ships is therefore this commit's interface rather than whatever was last built by hand.
      - name: Build the administration interface
        run: npm run build --prefix apps/media

      - name: Build the Media Server
        shell: bash
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p media-server --bin media-server

      # The real executable on the real platform, rather than a test harness: a platform must not
      # pass packaging by compiling alone.
      - name: Smoke-test the built server
        shell: bash
        env:
          BINARY: .artifacts/build/cargo/${{ matrix.target }}/release/${{ matrix.binary }}
        run: |
          set -euo pipefail
          "$BINARY" --check-configuration

      - name: Stage the release archive
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          out=".artifacts/release"
          tmp="$(npm run --silent artifact-path -- tmp)"
          mkdir -p "$out" "$tmp"

          stage_root="$(mktemp -d "$tmp/media-release-stage.XXXXXX")"
          trap 'rm -rf -- "$stage_root"' EXIT
          stage="$stage_root/tosklight-media-$VERSION-$SLUG"
          mkdir -p "$stage"
          # One file: the interface is embedded and nothing is read from disk at startup, so a
          # Media Server is an executable an operator copies to a machine and runs.
          cp ".artifacts/build/cargo/$TARGET/release/$BINARY" "$stage/"

          archive="tosklight-media-$VERSION-$SLUG.zip"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$(dirname "$stage")" && 7z a -tzip "$OLDPWD/$out/$archive" "$(basename "$stage")")
          else
            (cd "$(dirname "$stage")" && zip -q -r "$OLDPWD/$out/$archive" "$(basename "$stage")")
          fi
          ls -la "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-release-${{ matrix.slug }}
          path: .artifacts/release
          if-no-files-found: error

  attach:
    name: Media release / Attach to the release
    needs: [decide, build]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: media-release-*
          path: .artifacts/release
          merge-multiple: true

      - name: Verify every platform produced an archive
        shell: bash
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          for slug in macos-arm64 linux-amd64 linux-arm64 windows-amd64; do
            test -f ".artifacts/release/tosklight-media-$VERSION-$slug.zip"
          done
          # A checksum file of its own, so adding these to an existing release does not have to
          # rewrite the checksums the pipeline already published.
          (cd .artifacts/release && sha256sum ./*.zip > MEDIA-SHA256SUMS)
          ls -la .artifacts/release

      # The same release the pipeline just published, not a second one: an operator looking for
      # version 2.4.0 finds the desk and the Media Server in one place.
      - name: Attach the archives to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json tagName --jq .tagName
          gh release upload "v$VERSION" --clobber \
            .artifacts/release/tosklight-media-"$VERSION"-*.zip \
            .artifacts/release/MEDIA-SHA256SUMS
