name: Pages

# GitHub owns the Pages build and deployment. Forgejo mirrors main here but never builds
# or deploys the site itself. The later semantic-release version commit is also mirrored
# to main, so it replaces any earlier build with the correctly versioned download links.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish. Empty deploys main.
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || 'main' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/control-ui/package-lock.json

      # The semantic test catalog uses TypeScript's static AST API from the control UI
      # package. A fresh Pages runner has no workspace dependencies until this install.
      - name: Install semantic catalog dependencies
        working-directory: apps/control-ui
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/help/.tooling/requirements.txt

      # The PDF manual is rendered with WeasyPrint, which needs the system Pango stack.
      - name: Install manual rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Assemble the public site
        run: npm run pages:generate

      - name: Resolve the assembled site directory
        id: site
        run: echo "path=$(npm run --silent artifact-path -- pages)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
