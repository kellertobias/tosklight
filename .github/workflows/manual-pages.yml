name: Publish current operator manual

# Generated captures are uploaded separately, never committed. Rebuild the manual from this
# exact source revision and its verified capture archive, preserving the rest of the live site.
on:
  workflow_dispatch:
    inputs:
      capture_release:
        description: Release containing the source-bound generated capture archive
        type: string
        required: true
      capture_asset:
        description: Capture ZIP asset name
        type: string
        required: true
      capture_sha256:
        description: Expected capture archive SHA256
        type: string
        required: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly-documentation
  cancel-in-progress: false

jobs:
  build:
    name: Manual / Verify captures and build current manual
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/help/.tooling/requirements.txt
      - run: npm ci
      - uses: ./.github/actions/package-mirror
      - name: Install manual renderer dependencies
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0
      - name: Download and verify source-bound captures
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RELEASE: ${{ inputs.capture_release }}
          CAPTURE_ASSET: ${{ inputs.capture_asset }}
          CAPTURE_SHA256: ${{ inputs.capture_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CAPTURE_ASSET" =~ ^manual-captures-[a-f0-9]{40}\.zip$ ]]
          [[ "$CAPTURE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p .artifacts/tmp/manual-publication
          gh release download "$CAPTURE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern "$CAPTURE_ASSET" --dir .artifacts/tmp/manual-publication
          archive=".artifacts/tmp/manual-publication/$CAPTURE_ASSET"
          printf '%s  %s\n' "$CAPTURE_SHA256" "$archive" | sha256sum --check
          python3 tools/manual-captures.py restore "$archive"
          node tools/check-help-screenshot-set.mjs
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "LIGHT_MANUAL_VERSION=${version#v}" >> "$GITHUB_ENV"
      - name: Build and verify PDF and offline HTML from the refreshed assets
        env:
          RUSTC_WRAPPER: ""
        run: npm run manual
      - name: Reuse the published site and replace its manual
        run: |
          set -euo pipefail
          base_run=""
          while read -r candidate; do
            conclusion="$(gh run view "$candidate" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
            if [[ "$conclusion" == success ]]; then base_run="$candidate"; break; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=github-pages&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[].workflow_run.id')
          if [[ -n "$base_run" ]]; then
            echo "Reusing retained published Pages artifact from run $base_run."
            mkdir -p .artifacts/tmp/manual-publication/pages-base .artifacts/generated/pages
            gh run download "$base_run" --repo "$GITHUB_REPOSITORY" --name github-pages --dir .artifacts/tmp/manual-publication/pages-base
            tar -xf .artifacts/tmp/manual-publication/pages-base/artifact.tar -C .artifacts/generated/pages
          else
            echo "No successful retained Pages artifact is available; rebuilding the complete site from current source and the verified manual."
            published_status="$GITHUB_WORKSPACE/.artifacts/tmp/manual-publication/published-performance-status.json"
            curl --fail --show-error --location --retry 3 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 120 \
              https://kellertobias.github.io/tosklight/performance/status.json \
              --output "$published_status"
            node --input-type=module - "$published_status" <<'JS_STATUS'
          import { readFileSync } from 'node:fs';
          import { normalizePublicPerformanceStatus } from './tools/performance-publication.mjs';
          const status = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (normalizePublicPerformanceStatus(status) !== status) {
            throw new Error('Published performance status is invalid; refusing to discard existing measurement evidence.');
          }
          console.log('Validated the published performance status for preservation.');
          JS_STATUS
            LIGHT_REUSE_MANUAL=1 LIGHT_RELEASE_VERSION="$LIGHT_MANUAL_VERSION" \
              LIGHT_PERFORMANCE_STATUS_FILE="$published_status" npm run pages:generate
            node --input-type=module - "$published_status" <<'JS_PRESERVED'
          import { readFileSync } from 'node:fs';
          import { deepStrictEqual } from 'node:assert';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          deepStrictEqual(read('.artifacts/generated/pages/performance/status.json'), read(process.argv[2]),
            'Rebuilding the site must preserve the published performance evidence.');
          JS_PRESERVED
            test -f .artifacts/generated/pages/storybook/index.html
            test -f .artifacts/generated/pages/safari/index.html
          fi
          test -f .artifacts/generated/pages/index.html
          rm -rf .artifacts/generated/pages/manual
          cp -R .artifacts/generated/manual/html/tosklight-manual .artifacts/generated/pages/manual
          cp .artifacts/generated/manual/pdf/tosklight-manual.pdf .artifacts/generated/pages/tosklight-manual.pdf
          cp -R docs/site/. .artifacts/generated/pages/
          LIGHT_RELEASE_VERSION="$LIGHT_MANUAL_VERSION" \
            LIGHT_PERFORMANCE_STATUS_FILE=.artifacts/generated/pages/performance/status.json \
            node tools/render-landing-page.mjs .artifacts/generated/pages/index.html
          node tools/site-legal/cli.mjs inject .artifacts/generated/pages
          node tools/site-legal/cli.mjs check .artifacts/generated/pages
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('.artifacts/generated/pages')
          files = [root/'manual/index.html', root/'tosklight-manual.pdf']
          files += sorted((root/'manual').rglob('*.png'))
          files += sorted((root/'manual').rglob('*.svg'))
          files += sorted((root/'screenshots').rglob('*.jpg'))
          report = {'sourceCommit': os.environ['GITHUB_SHA'], 'captureArchiveSHA256': os.environ['CAPTURE_SHA256'], 'files': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          (root/'manual-publication.json').write_text(json.dumps(report, indent=2)+'\n')
          PY
        # Record the exact capture input alongside downloadable online output checksums.
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_SHA256: ${{ inputs.capture_sha256 }}
          TOSKLIGHT_IMPRINT_CONTACT: ${{ secrets.TOSKLIGHT_IMPRINT_CONTACT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-manual-current
          path: .artifacts/generated/manual
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .artifacts/generated/pages
  deploy:
    name: Manual / Deploy current manual to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
