name: Publish Storybook to Pages

# The full documentation workflow remains release-owned. This focused publisher reuses the last
# successfully assembled Pages artifact and replaces only its Storybook subtree.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Storybook / Build Pages artifact
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run storybook:build

      - name: Reuse the last successfully assembled public site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base_run="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow documentation.yml \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$base_run"
          mkdir -p .artifacts/pages-base .artifacts/generated/pages
          gh run download "$base_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name github-pages \
            --dir .artifacts/pages-base
          tar -xf .artifacts/pages-base/artifact.tar -C .artifacts/generated/pages
          test -f .artifacts/generated/pages/index.html
          rm -rf .artifacts/generated/pages/storybook
          mkdir -p .artifacts/generated/pages/storybook
          cp -R .artifacts/build/storybook/ui/. .artifacts/generated/pages/storybook/
          test -f .artifacts/generated/pages/storybook/index.html

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .artifacts/generated/pages

  deploy:
    name: Storybook / Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
