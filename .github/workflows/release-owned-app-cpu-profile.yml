name: Release owned application CPU cause (one paired case)

# Diagnostic only: one existing576 OFF/ON pair; unchanged rates and gates. No release publication.
on:
  push:
    branches: [codex/release-output-cohort-diagnostics]
    paths:
      - .github/workflows/release-owned-app-cpu-profile.yml
      - tools/run-desktop-performance.mjs
      - tools/run-desktop-performance.test.mjs
      - tools/desktop-performance-profile.py
      - tools/desktop-performance-profile.test.py

permissions:
  contents: read

concurrency:
  group: owned-app-cpu-profile-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  owned-application-cause:
    if: github.repository == 'kellertobias/tosklight'
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EXPECTED_SHA: ${{ github.sha }}
      CANDIDATE_SHA: 702d935b6dd31105f9b034d608e59f74614b98be
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Freeze source and public artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -B - <<'PYTHON'
          import hashlib, json, os, pathlib, sys
          sys.path.insert(0, 'tools')
          from artifact_paths import artifact_path
          out = artifact_path('LIGHT_TEST_RESULTS_DIR', 'TEST_RESULTS') / f"tl775-owned-app-cpu-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          out.mkdir(parents=True, exist_ok=False)
          temporary = artifact_path('LIGHT_TMP_DIR', 'TMP_ROOT')
          temporary.mkdir(parents=True, exist_ok=True)
          paths = ['.github/workflows/release-owned-app-cpu-profile.yml',
                   'tools/run-desktop-performance.mjs', 'tools/run-desktop-performance.test.mjs',
                   'tools/desktop-performance-profile.py', 'tools/desktop-performance-profile.test.py',
                   'tools/artifact_paths.py', 'tools/artifact-layout.conf']
          manifest = {'source_sha': os.environ['EXPECTED_SHA'],
                      'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'purpose': 'PUBLIC owned-app CPU cause, exact576 OFF/ON; not performance acceptance',
                      'build_or_cohorts_requested': True, 'candidate_source_sha': os.environ['CANDIDATE_SHA'], 'preflight_global_seconds': 50,
                      'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}}
          (out / 'source-workflow.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'PROFILE_PREFLIGHT_OUT={out}\n')
              stream.write(f'TMPDIR={temporary}\n')
          PYTHON

      - name: Pure and mocked helper checks before tool setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/desktop-performance-profile.test.py \
            2>&1 | tee "$PROFILE_PREFLIGHT_OUT/pure-tests.log"

      - name: Provide official Linux tools within five minutes
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYTHON'
          import hashlib, json, os, pathlib, platform, shutil, subprocess, time
          manifest_path = pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT']) / 'source-workflow.json'
          manifest = json.loads(manifest_path.read_text())
          deadline = time.monotonic() + 280
          audit = {'kernel': platform.release(), 'architecture': platform.machine(),
                   'attempts': [], 'setup_attempted': False, 'capability': 'NOT RUN'}
          manifest['tool_availability'] = audit
          def save():
              manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          def query(args):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError('tool discovery deadline exceeded')
              return subprocess.run(args, text=True, capture_output=True, timeout=min(10, remaining))
          def canonical_packages(canonical, owned, query, owner_checks):
              if canonical in owned:
                  return owned[canonical]
              lookup = query(['dpkg-query', '-S', canonical])
              check = {'canonical': canonical, 'owner_query_exit': lookup.returncode, 'owners': []}
              owner_checks.append(check)
              if lookup.returncode:
                  return []
              accepted = []
              for line in lookup.stdout.splitlines():
                  package, separator, path = line.partition(': ')
                  if not separator or path != canonical:
                      continue
                  status = query(['dpkg-query', '-W', '-f=${db:Status-Abbrev}\n', package])
                  files = query(['dpkg-query', '-L', package])
                  installed = status.returncode == 0 and status.stdout.startswith('ii')
                  exact_file = files.returncode == 0 and canonical in files.stdout.splitlines()
                  check['owners'].append({'package': package, 'installed': installed, 'exact_file_list': exact_file})
                  if installed and exact_file:
                      accepted.append(package)
              return accepted
          def discover():
              result = {'cc': shutil.which('cc'), 'readelf': shutil.which('readelf'),
                        'packages': [], 'perf_paths': [], 'canonical_owner_checks': [], 'candidates': []}
              audit['attempts'].append(result)
              listing = query(['dpkg-query', '-W', '-f=${binary:Package}\t${db:Status-Abbrev}\n', 'linux-tools-*'])
              result['package_query_exit'] = listing.returncode
              owned = {}
              for line in listing.stdout.splitlines():
                  package, status = line.split('\t', 1)
                  row = {'package': package, 'status': status}
                  result['packages'].append(row)
                  if not status.startswith('ii'):
                      continue
                  files = query(['dpkg-query', '-L', package])
                  row['files_query_exit'] = files.returncode
                  if files.returncode:
                      continue
                  for raw in files.stdout.splitlines():
                      if raw.startswith('/'):
                          owned.setdefault(raw, []).append(package)
              for raw, packages in sorted(owned.items()):
                  path = pathlib.Path(raw)
                  if path.name != 'perf':
                      continue
                  row = {'path': raw, 'packages': packages, 'symlink': path.is_symlink()}
                  result['perf_paths'].append(row)
                  try:
                      canonical = path.resolve(strict=True)
                      row['canonical'] = str(canonical)
                      owners = canonical_packages(str(canonical), owned, query, result['canonical_owner_checks'])
                      if not owners:
                          row['rejected'] = 'canonical target has no installed package owner with exact file-list membership'
                      elif not canonical.is_file() or not os.access(canonical, os.X_OK):
                          row['rejected'] = 'canonical target not an executable regular file'
                      else:
                          with canonical.open('rb') as stream:
                              magic = stream.read(4)
                          row['magic_hex'] = magic.hex()
                          if magic != b'\x7fELF':
                              row['rejected'] = 'not a direct ELF (wrapper or other format)'
                          else:
                              result['candidates'].append({'path': str(canonical), 'packages': owners,
                                  'via': raw, 'sha256': hashlib.sha256(canonical.read_bytes()).hexdigest()})
                  except (OSError, RuntimeError) as error:
                      row['rejected'] = type(error).__name__
              save()
              return result
          try:
              release = pathlib.Path('/etc/os-release')
              if release.exists():
                  audit['os_release'] = {key: value.strip('"') for key, value in
                      (line.split('=', 1) for line in release.read_text().splitlines() if '=' in line)
                      if key in ('ID', 'VERSION_ID', 'NAME')}
              current = discover()
              if not current['candidates'] or not current['cc'] or not current['readelf']:
                  # One official package setup, no policy/sysctl/capability changes.
                  if deadline - time.monotonic() < 255:
                      raise TimeoutError('insufficient bounded setup budget; no installer started')
                  audit['setup_attempted'] = True
                  save()
                  setup = subprocess.run(['sudo', '-n', 'timeout', '--signal=TERM', '--kill-after=10s', '240s',
                      'env', 'DEBIAN_FRONTEND=noninteractive', 'NEEDRESTART_MODE=a', 'bash', '-c',
                      'set -e; apt-get update; apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic binutils build-essential'],
                      timeout=255)
                  audit['setup_exit'] = setup.returncode
                  save()
                  current = discover()
              if not current['candidates'] or not current['cc'] or not current['readelf']:
                  raise RuntimeError('official direct perf ELF/compiler/binutils unavailable')
              current['candidates'].sort(key=lambda item: (audit['kernel'] in item['via'] or audit['kernel'] in item['path'], item['path']))
              selected = current['candidates'][-1]
              manifest['tool_selection'] = {**selected, 'kernel': audit['kernel'],
                  'kernel_match': audit['kernel'] in selected['via'] or audit['kernel'] in selected['path'],
                  'selection': 'installed package-listed canonical ELF; exact kernel preferred; capability unproved'}
              audit['status'] = 'TOOLS_AVAILABLE_CAPABILITY_UNPROVED'
              save()
              with open(os.environ['GITHUB_ENV'], 'a') as stream:
                  stream.write(f"LIGHT_PERF_ELF={selected['path']}\n")
          except (OSError, ValueError, RuntimeError, TimeoutError, subprocess.SubprocessError) as error:
              audit['status'] = 'STOP'
              audit['error'] = str(error)
              save()
              raise SystemExit('STOP: tool availability failed; see source-workflow.json; no probe/build/cohorts')
          PYTHON

      - name: One bounded synthetic capability preflight
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          # External 60+8s containment leaves the helper's reviewed shared50s cleanup budget.
          # The helper alone may use one permission-denied-only sudo-n attempt. STOP is failure.
          timeout --signal=TERM --kill-after=8s 60s python3 -B \
            tools/desktop-performance-profile.py preflight \
            --output "$PROFILE_PREFLIGHT_OUT/preflight.json"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 702d935b6dd31105f9b034d608e59f74614b98be
          path: .artifacts/tmp/tl775-candidate-source
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Freeze candidate and verify unchanged workload generators
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_WORKSPACE/.artifacts/tmp/tl775-candidate-source"
          test "$(git -C "$candidate" rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 -B - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          candidate = root / '.artifacts/tmp/tl775-candidate-source'
          # The runner alone has a reviewed selector/observer. Its imported workload
          # builders, demo and resource arithmetic must match the candidate exactly.
          paths = ['assets/demo.show', 'tools/stage-dynamics-scene.mjs',
                   'tools/stage-large-scene.mjs', 'tools/process-tree-resources.mjs']
          same = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in paths}
          if any(same[p] != hashlib.sha256((candidate / p).read_bytes()).hexdigest() for p in paths):
              raise SystemExit('STOP: orchestration/candidate workload source differs')
          out = pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT'])
          data = {'candidate_source_sha': os.environ['CANDIDATE_SHA'],
                  'orchestration_source_sha': os.environ['EXPECTED_SHA'],
                  'workload_sha256': same, 'case_id': 'sixteen_universe',
                  'pair_order': ['off', 'on'], 'requested_rate_hz': 40,
                  'measurement_seconds': 60, 'codegen_flags_changed': False,
                  'qualification': 'One causal diagnostic pair, not full application acceptance',
                  'rustc': subprocess.check_output(['rustc', '-Vv'], text=True)}
          (out / 'application-source-binaries.json').write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'CANDIDATE_DIR={candidate}\n')
          PYTHON
          node --test tools/run-desktop-performance.test.mjs

      - uses: ./.github/actions/package-mirror

      - name: Install canonical Linux bundle dependencies
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          sudo timeout 180 apt-get update
          sudo timeout 900 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libudev-dev libasound2-dev \
            libxdo-dev libxkbcommon-x11-0 mesa-vulkan-drivers vulkan-tools \
            build-essential xvfb libgl1-mesa-dri

      - name: Build exact canonical candidate without diagnostic codegen changes
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          test -z "${PATCHELF+x}"
          test -z "${RUSTFLAGS:-}"
          test -z "${CARGO_ENCODED_RUSTFLAGS:-}"
          npm ci
          npm run build --prefix apps/light-desktop
          cargo build --release --locked --target "$TARGET" \
            -p light-headless --bin light-headless --bin light-benchmark -p viz-renderer --bin viz-renderer
          sidecars="$(npm run --silent artifact-path -- tmp)/tl775-owned-profile-sidecars"
          mkdir -p "$sidecars"
          cp ".artifacts/build/cargo/$TARGET/release/light-headless" "$sidecars/light-headless-$TARGET"
          cp ".artifacts/build/cargo/$TARGET/release/viz-renderer" "$sidecars/viz-renderer-$TARGET"
          export LIGHT_DESKTOP_SIDECAR_DIR="$sidecars"
          export LIGHT_DESKTOP_SIDECAR_TARGET="$TARGET"
          config="$(npm run --silent artifact-path -- tmp)/tl775-owned-profile-control.json"
          node tools/write-tauri-artifact-config.mjs control "$config"
          npm run --prefix apps/light-desktop tauri:build -- --target "$TARGET" \
            --config "$config" --bundles appimage
          cd "$GITHUB_WORKSPACE"
          python3 -B - <<'PYTHON'
          import hashlib, importlib.util, json, os, pathlib, sys, time
          import subprocess
          sys.path.insert(0, 'tools')
          spec = importlib.util.spec_from_file_location('profile', 'tools/desktop-performance-profile.py')
          profile = importlib.util.module_from_spec(spec); spec.loader.exec_module(profile)
          candidate = pathlib.Path(os.environ['CANDIDATE_DIR'])
          release = candidate / '.artifacts/build/cargo' / os.environ['TARGET'] / 'release'
          apps = list((release / 'bundle/appimage').glob('*.AppImage'))
          if len(apps) != 1:
              raise SystemExit('STOP: canonical AppImage is not unique')
          # Freeze the exact generated image before extraction. This executes
          # only its fixed extraction runtime, never AppRun or the desk workload.
          image_sha = profile.digest(apps[0])
          stage = pathlib.Path(os.environ['TMPDIR']) / 'tl775-packaged-sidecar-preflight'
          stage.mkdir(mode=0o700, exist_ok=False)
          subprocess.run([str(apps[0]), '--appimage-extract'], cwd=stage,
                         check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=60)
          out = pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT']) / 'application-source-binaries.json'
          manifest = json.loads(out.read_text())
          actual_source = subprocess.check_output(['git', '-C', str(candidate), 'rev-parse', 'HEAD'], text=True).strip()
          try:
              if actual_source != os.environ['CANDIDATE_SHA']:
                  raise SystemExit('STOP: candidate source changed before packager provenance')
              cache_root = pathlib.Path(os.environ.get('XDG_CACHE_HOME', pathlib.Path.home() / '.cache'))
              replay = profile.prepare_packager_replay(cache_root / 'tauri/linuxdeploy-x86_64.AppImage',
                  pathlib.Path(os.environ['TMPDIR']) / 'tl775-exact-packager-replay',
                  actual_source, image_sha, time.monotonic() + 45)
              manifest['packager_tool_provenance'] = replay['public']
              out.write_text(json.dumps(manifest, indent=2) + '\n')
              proof = profile.verified_packaged_roles(release, stage / 'squashfs-root', apps[0], image_sha,
                  os.environ['CANDIDATE_SHA'], actual_source, time.monotonic() + 30, replay=replay)
          except profile.PackagedBindingRefused as error:
              manifest.update(packaged_preflight_status='STOP', packaged_preflight_code=str(error),
                              packaged_preflight=error.diagnostic)
              out.write_text(json.dumps(manifest, indent=2) + '\n')
              raise SystemExit('STOP: packaged sidecar provenance/symbol preflight refused before any workload')
          roles = proof['roles']
          owner_path = stage / 'squashfs-root/usr/bin/light-desktop'
          if owner_path.is_symlink() or not owner_path.is_file() or not os.access(owner_path, os.X_OK):
              raise SystemExit('STOP: fixed packaged Tauri owner unavailable')
          owner = {'sha256': profile.digest(owner_path), 'build_id': profile.build_id(owner_path, time.monotonic() + 3)}
          layout_hashes = {p: profile.digest(candidate / p) for p in profile.LAYOUT_HASHES}
          if layout_hashes != profile.LAYOUT_HASHES or actual_source != profile.APP_SOURCE:
              raise SystemExit('STOP: unreviewed source layout')
          preflight = json.loads((pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT']) / 'preflight.json').read_text())
          if preflight.get('status') != 'CAPABLE' or preflight.get('helper_sha256') != profile.digest(profile.__file__):
              raise SystemExit('STOP: preverified perf binding unavailable')
          perf_identity = {'sha256': preflight['perf_sha256'], 'build_id': preflight['perf_build_id']}
          if profile.digest(profile.find_perf()) != perf_identity['sha256']:
              raise SystemExit('STOP: selected perf changed after preflight')
          templates = profile.prepare_elf_templates(stage / 'squashfs-root', roles,
              {'owner': owner, 'perf': perf_identity}, pathlib.Path(os.environ['TMPDIR']) / 'tl775-immutable-elf-tables',
              time.monotonic() + 60)
          descriptor = {'schema': 1, 'source_sha': os.environ['CANDIDATE_SHA'], 'roles': roles,
                        'owner': owner, 'layout_hashes': layout_hashes, 'perf_identity': perf_identity, 'elf_templates': templates}
          manifest['immutable_elf_preparation'] = {'source_sha': actual_source,
              'producer_sha256': profile.digest(profile.__file__), 'prepared_before_either_cohort': True,
              'tables': [{key: ref[key] for key in ('role', 'sha256', 'binary_sha256', 'build_id')} for ref in templates]}
          path = pathlib.Path(os.environ['TMPDIR']) / 'tl775-owned-profile-binaries.json'
          path.write_text(json.dumps(descriptor) + '\n')
          manifest.update(roles=roles, owner=owner, layout_hashes=layout_hashes, appimage_sha256=image_sha,
                          packaged_preflight_status='VERIFIED', packaged_preflight=proof,
                          descriptor_source='fixed executables extracted from exact canonical AppImage')
          manifest['source_sha256'] = {p: profile.digest(candidate / p) for p in ['Cargo.lock', 'package-lock.json']}
          out.write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'DIAGNOSTIC_APPIMAGE={apps[0].resolve()}\nOWNED_PROFILE_BINARIES={path}\n')
          PYTHON

      - name: One unchanged576 OFF then ON pair with owned-role CPU observation
        id: pair
        timeout-minutes: 40
        shell: bash
        env:
          RUST_LOG: info
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: |
          set -euo pipefail
          overall=0
          for observer in off on; do
            enabled=false
            args=()
            if [[ "$observer" == on ]]; then
              enabled=1
              args=(--owned-cpu-profile-binaries "$OWNED_PROFILE_BINARIES")
            fi
            destination="$TMPDIR/tl775-owned-pair-$observer"
            status=0
            LIGHT_OUTPUT_PHASE_DIAGNOSTICS="$enabled" xvfb-run -a \
              node tools/run-desktop-performance.mjs --case sixteen_universe \
              --application "$DIAGNOSTIC_APPIMAGE" --demo-show "$CANDIDATE_DIR/assets/demo.show" \
              --output-dir "$destination" "${args[@]}" >"$TMPDIR/tl775-pair-$observer.stdout" \
              2>"$TMPDIR/tl775-pair-$observer.stderr" || status=$?
            printf '%s\n' "$status" > "$TMPDIR/tl775-pair-$observer.exit"
            if [[ "$status" != 0 ]]; then overall=1; fi
          done
          # Raw logs, process manifests and perf spools are deliberately not public artifacts.
          python3 -B - <<'PYTHON'
          import json, os, pathlib
          root, out = pathlib.Path(os.environ['TMPDIR']), pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT'])
          measurements = {'purpose': 'same576 diagnostic OFF/ON, unchanged acceptance gates', 'pair': {}}
          def numeric(value):
              if isinstance(value, (bool, int, float)) or value is None:
                  return value
              if isinstance(value, list):
                  return [numeric(v) for v in value if not isinstance(v, str)]
              if isinstance(value, dict):
                  return {k: numeric(v) for k, v in value.items() if not isinstance(v, str)}
              raise ValueError('non-numeric public measurement')
          for mode in ['off', 'on']:
              folder = root / f'tl775-owned-pair-{mode}'
              files = sorted(folder.glob('*.json'))
              # Publish only the normalized aggregate report, not runtime state or request manifests.
              reports = [p for p in files if p.name == 'desktop-scenarios.json']
              measurements['pair'][mode] = {'collector_exit': int((root / f'tl775-pair-{mode}.exit').read_text()),
                                            'aggregate_report_present': len(reports) == 1}
              if reports:
                  measurements['pair'][mode]['report_numeric_only'] = numeric(json.loads(reports[0].read_text()))
              evidence = list(folder.glob('*-measurement.json'))
              if len(evidence) == 1:
                  data = json.loads(evidence[0].read_text())
                  measurements['pair'][mode]['measurement_numeric_only'] = numeric({'summary': data.get('state', {}).get('measurement'),
                      'samples': [{k: v for k, v in row.items() if k != 'processes'} for row in data.get('samples', [])]})
          receipts = list((root / 'tl775-owned-pair-on').glob('*-owned-profile.json'))
          if len(receipts) == 1:
              (out / 'owned-application-profile.json').write_bytes(receipts[0].read_bytes())
          (out / 'paired-measurements.json').write_text(json.dumps(measurements, indent=2) + '\n')
          PYTHON
          exit "$overall"

      - name: Preserve an explicit STOP when capability did not complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PROFILE_PREFLIGHT_OUT:-}" ]]; then
            python3 -B - <<'PYTHON'
          import json, os, pathlib
          path = pathlib.Path(os.environ['PROFILE_PREFLIGHT_OUT']) / 'preflight.json'
          if not path.exists():
              path.write_text(json.dumps({'status': 'STOP', 'canonical_build_allowed': False,
                  'code': 'preflight_or_prior_step_incomplete',
                  'qualification': 'No completed capability receipt; no application build or cohort requested; actor cleanup not inferred'}) + '\n')
          PYTHON
          fi

      - name: Retain public safe receipts only
        if: always() && env.PROFILE_PREFLIGHT_OUT != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tl775-owned-app-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PROFILE_PREFLIGHT_OUT }}/preflight.json
            ${{ env.PROFILE_PREFLIGHT_OUT }}/source-workflow.json
            ${{ env.PROFILE_PREFLIGHT_OUT }}/pure-tests.log
            ${{ env.PROFILE_PREFLIGHT_OUT }}/application-source-binaries.json
            ${{ env.PROFILE_PREFLIGHT_OUT }}/owned-application-profile.json
            ${{ env.PROFILE_PREFLIGHT_OUT }}/paired-measurements.json
          if-no-files-found: error
