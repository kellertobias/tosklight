name: CI, release, and Pages

# Forgejo owns every branch. Its push mirror delivers those branch commits here.
# GitHub validates mirrored pushes and pull requests, then creates only v* release
# tags and hosted releases. It never creates or pushes a branch commit.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Release / Select version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Select the build and release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
          if [[ -n "$latest_tag" ]]; then
            version="${latest_tag#v}"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            LIGHT_RELEASE_OUTPUT="$GITHUB_OUTPUT" npm run release:dry-run
          fi

  quality:
    name: Checks / Linting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: quality

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - name: Install native Rust and desktop development files
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libasound2-dev build-essential

      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui

      - name: Build the embedded Control UI
        run: npm run build --prefix apps/control-ui

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

  unit:
    name: Tests / Unit and architecture
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: unit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui

      - run: npm run test:unit

  e2e:
    name: Tests / Playwright / ${{ matrix.label }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: API, suite: api, shard: 1/1, artifact: api }
          - { label: UI, suite: ui, shard: 1/1, artifact: ui }
          - { label: Supplemental, suite: supplemental, shard: 1/1, artifact: supplemental }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: e2e-${{ matrix.artifact }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui

      - name: Install Chrome for Playwright
        working-directory: apps/control-ui
        run: npx playwright install --with-deps chrome

      - run: npm run test:e2e-${{ matrix.suite }} -- --shard=${{ matrix.shard }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-${{ matrix.artifact }}
          path: |
            .artifacts/test/playwright-report
            .artifacts/test/results
          if-no-files-found: ignore

  benchmark:
    name: Tests / Server performance regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: benchmark

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - name: Build the embedded Control UI
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui
          npm run build --prefix apps/control-ui

      - name: Reject large-show mutation performance regressions
        run: >-
          cargo run --release --locked -p light-server --bin light-benchmark
          --no-default-features --
          --profile low-power-4 --protocol artnet --transport encode-only
          --seconds 1 --warmup-seconds 0 --mutation-gate
          --hardware-label "GitHub Actions ubuntu-22.04"

  desktop-smoke:
    name: Tests / Desktop smoke / macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: desktop-smoke

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui

      - run: npm run test:desktop-smoke

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: desktop-smoke-data
          path: .artifacts/build/cargo/debug/bundle/macos
          if-no-files-found: ignore

  manual:
    name: Documentation / Operator manual
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      LIGHT_MANUAL_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/help/.tooling/requirements.txt

      - name: Install manual rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - run: npm run manual

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-manual
          path: .artifacts/generated/manual
          if-no-files-found: error

  visual-assets:
    name: Documentation / Screenshots and product demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [metadata, unit, e2e]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: visual-assets

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui

      - name: Install Chrome and video tooling
        working-directory: apps/control-ui
        run: |
          npx playwright install --with-deps chrome
          sudo apt-get install -y ffmpeg

      - name: Generate help screenshots
        run: npm run test:help-screenshots

      - name: Generate the product-demo video
        run: npm run test:demo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: help-screenshots
          path: docs/help/assets/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: product-demo
          path: .artifacts/test/visual-inspection/product-demo
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: visual-playwright-results
          path: .artifacts/test
          if-no-files-found: ignore

  build:
    name: Build / Release archive / ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    env:
      LIGHT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            server_binary: light-server
            desktop: true
          - label: Linux (x86_64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-amd64
            server_binary: light-server
            desktop: true
          - label: Linux (ARM64 / Raspberry Pi)
            runner: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            slug: linux-arm64
            server_binary: light-server
            desktop: false
            cross: true
            cargo_flags: --no-default-features
          - label: Windows (x86_64)
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-amd64
            server_binary: light-server.exe
            desktop: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux' && matrix.desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libasound2-dev build-essential

      - name: Install the cross-compilation toolchain
        if: matrix.cross
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Install frontend dependencies
        shell: bash
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui

      - name: Build the Control UI bundle
        working-directory: apps/control-ui
        run: npm run build

      - name: Build the standalone server
        shell: bash
        run: |
          ${{ matrix.cross && 'cargo zigbuild' || 'cargo build' }} \
            --release --locked --target ${{ matrix.target }} \
            ${{ matrix.cargo_flags }} \
            -p light-server --bin light-server

      - name: Build the ToskLight desktop application
        if: matrix.desktop
        shell: bash
        run: |
          config="$RUNNER_TEMP/tauri-control-release.json"
          node tools/write-tauri-artifact-config.mjs control "$config"
          npm run --prefix apps/control-ui tauri:build -- --target ${{ matrix.target }} --config "$config"

      - name: Build the Hardware Controls application
        if: matrix.slug == 'macos-arm64'
        shell: bash
        run: |
          config="$RUNNER_TEMP/tauri-hardware-release.json"
          node tools/write-tauri-artifact-config.mjs hardware "$config"
          npm run --prefix apps/hardware-controls tauri:build -- --target ${{ matrix.target }} --config "$config"

      - name: Stage release artifacts
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
          SERVER_BINARY: ${{ matrix.server_binary }}
        run: |
          set -euo pipefail
          version="$LIGHT_RELEASE_VERSION"
          out=".artifacts/release"
          mkdir -p "$out"

          stage="$(mktemp -d)/light-server-$version-$SLUG"
          mkdir -p "$stage"
          cp ".artifacts/build/cargo/$TARGET/release/$SERVER_BINARY" "$stage/"
          cp -R assets/fixture-library "$stage/fixture-library"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$(dirname "$stage")" && 7z a -tzip "$OLDPWD/$out/light-server-$version-$SLUG.zip" "$(basename "$stage")")
          else
            (cd "$(dirname "$stage")" && zip -q -r "$OLDPWD/$out/light-server-$version-$SLUG.zip" "$(basename "$stage")")
          fi

          bundle=".artifacts/build/cargo/$TARGET/release/bundle"
          case "$SLUG" in
            macos-arm64)
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/ToskLight.app" "$out/tosklight-$version-macos-arm64.zip"
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/ToskLight Hardware Controls.app" \
                "$out/tosklight-hardware-controls-$version-macos-arm64.zip"
              ;;
            linux-amd64)
              cp "$bundle"/appimage/*.AppImage "$out/tosklight-$version-linux-amd64.AppImage"
              cp "$bundle"/deb/*.deb "$out/tosklight-$version-linux-amd64.deb"
              ;;
            linux-arm64)
              ;;
            windows-amd64)
              cp "$bundle"/nsis/*-setup.exe "$out/tosklight-$version-windows-amd64-setup.exe"
              ;;
          esac
          ls -la "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.slug }}
          path: .artifacts/release/*
          if-no-files-found: error

  pages-build:
    name: Documentation / Assemble static website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [metadata, manual, visual-assets]
    runs-on: ubuntu-22.04
    env:
      LIGHT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      LIGHT_REQUIRE_DEMO_VIDEO: "1"
      LIGHT_REUSE_MANUAL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/control-ui/package-lock.json
            apps/hardware-controls/package-lock.json

      - name: Install semantic catalog dependencies
        run: |
          npm ci --prefix apps/hardware-controls
          npm ci --prefix apps/control-ui

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: operator-manual
          path: .artifacts/generated/manual

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: help-screenshots
          path: docs/help/assets/screenshots

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-demo
          path: .artifacts/test/visual-inspection/product-demo

      - name: Assemble the public site
        run: npm run pages:generate

      - name: Resolve the assembled site directory
        id: site
        run: echo "path=$(npm run --silent artifact-path -- pages)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.site.outputs.path }}

  release:
    name: Release / Tag and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - metadata
      - quality
      - unit
      - e2e
      - benchmark
      - desktop-smoke
      - manual
      - visual-assets
      - build
      - pages-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: .artifacts/release
          merge-multiple: true

      - name: Verify release artifacts and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for required in \
            "light-server-$VERSION-macos-arm64.zip" \
            "tosklight-$VERSION-macos-arm64.zip" \
            "tosklight-hardware-controls-$VERSION-macos-arm64.zip" \
            "light-server-$VERSION-linux-amd64.zip" \
            "tosklight-$VERSION-linux-amd64.AppImage" \
            "tosklight-$VERSION-linux-amd64.deb" \
            "light-server-$VERSION-linux-arm64.zip" \
            "light-server-$VERSION-windows-amd64.zip" \
            "tosklight-$VERSION-windows-amd64-setup.exe"
          do
            test -f ".artifacts/release/$required"
          done
          (cd .artifacts/release && sha256sum * > SHA256SUMS)

      - name: Create the tag-only semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          LIGHT_EXPECTED_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          npm run release
          git diff --exit-code

      - name: Verify the published tag targets the tested commit
        if: needs.metadata.outputs.release == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA"

  pages-deploy:
    name: Documentation / Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release, pages-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
