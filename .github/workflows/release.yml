name: CI, release, and Pages

# Forgejo owns every branch. Its push mirror delivers those branch commits here.
# GitHub validates mirrored pushes and pull requests, then creates only v* release
# tags and hosted releases. It never creates or pushes a branch commit.
on:
  push:
    # A branch filter means tag pushes do not trigger this workflow.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Release / Select version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Select the build and release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
          if [[ -n "$latest_tag" ]]; then
            version="${latest_tag#v}"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            LIGHT_RELEASE_OUTPUT="$GITHUB_OUTPUT" npm run release:dry-run
          fi

  quality:
    name: Checks / Linting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: quality

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install native Rust and desktop development files
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libasound2-dev build-essential

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the embedded Control UI
        run: npm run build --prefix apps/light-desktop

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

  unit:
    name: Tests / Unit and architecture
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: unit

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - run: npm run test:unit

  e2e:
    name: Tests / Playwright / ${{ matrix.label }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: API, suite: api, shard: 1/1, artifact: api }
          - { label: UI (1/4), suite: ui, shard: 1/4, artifact: ui-1 }
          - { label: UI (2/4), suite: ui, shard: 2/4, artifact: ui-2 }
          - { label: UI (3/4), suite: ui, shard: 3/4, artifact: ui-3 }
          - { label: UI (4/4), suite: ui, shard: 4/4, artifact: ui-4 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: e2e-${{ matrix.artifact }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      # Each Playwright worker launches its own browser, Rust server, UDP listeners,
      # and isolated show. Keep one worker per runner to prevent local port/timing
      # contention; the matrix shards retain parallel throughput across runners.
      - run: npm run test:e2e-${{ matrix.suite }} -- --shard=${{ matrix.shard }} --workers=1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-${{ matrix.artifact }}
          path: |
            .artifacts/test/playwright-report
            .artifacts/test/results
          if-no-files-found: ignore

  manual:
    name: Documentation / Operator manual
    needs: metadata
    runs-on: ubuntu-22.04
    env:
      LIGHT_MANUAL_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/help/.tooling/requirements.txt

      - name: Install manual rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - run: npm run manual

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-manual
          path: .artifacts/generated/manual
          if-no-files-found: error

  visual-assets:
    name: Documentation / Screenshots and product demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [metadata, unit, e2e]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: visual-assets

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install Chrome and video tooling
        run: |
          npx playwright install --with-deps chrome
          sudo apt-get install -y ffmpeg

      - name: Generate help screenshots
        run: npm run test:help-screenshots

      - name: Generate the product-demo video
        run: npm run test:demo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: help-screenshots
          path: docs/help/assets/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: product-demo
          path: .artifacts/test/visual-inspection/product-demo
          if-no-files-found: warn

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: visual-playwright-results
          path: .artifacts/test
          if-no-files-found: ignore

  build:
    name: Build / Release archive / ${{ matrix.label }}
    if: github.event_name != 'pull_request'
    needs: metadata
    runs-on: ${{ matrix.runner }}
    env:
      LIGHT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            headless_binary: light-headless
            desktop: true
          - label: Linux (x86_64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-amd64
            headless_binary: light-headless
            desktop: true
          - label: Linux (ARM64 / Raspberry Pi)
            runner: ubuntu-22.04
            target: aarch64-unknown-linux-musl
            slug: linux-arm64
            headless_binary: light-headless
            desktop: false
            cross: true
            cargo_flags: --no-default-features
          - label: Windows (x86_64)
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-amd64
            headless_binary: light-headless.exe
            desktop: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux' && matrix.desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libasound2-dev build-essential xvfb

      - name: Install the cross-compilation toolchain
        if: matrix.cross
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Install workspace dependencies
        shell: bash
        run: npm ci

      - name: Build the Light desktop UI bundle
        run: npm run build --prefix apps/light-desktop

      - name: Build the standalone Light headless application
        shell: bash
        run: |
          ${{ matrix.cross && 'cargo zigbuild' || 'cargo build' }} \
            --release --locked --target ${{ matrix.target }} \
            ${{ matrix.cargo_flags }} \
            -p light-headless --bin light-headless

      - name: Build the release performance probe
        if: matrix.slug == 'linux-amd64'
        shell: bash
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --no-default-features -p light-headless --bin light-benchmark

      - name: Build the ToskLight desktop application
        if: matrix.desktop
        shell: bash
        run: |
          config="$RUNNER_TEMP/tauri-control-release.json"
          node tools/write-tauri-artifact-config.mjs control "$config"
          npm run --prefix apps/light-desktop tauri:build -- --target ${{ matrix.target }} --config "$config"

      - name: Bundle the headless application into the macOS app
        if: runner.os == 'macOS' && matrix.desktop
        shell: bash
        run: >-
          cp
          ".artifacts/build/cargo/${{ matrix.target }}/release/light-headless"
          ".artifacts/build/cargo/${{ matrix.target }}/release/bundle/macos/ToskLight.app/Contents/MacOS/light-headless"

      - name: Smoke-test the built desktop application
        if: matrix.desktop
        shell: bash
        env:
          LIGHT_DESKTOP_SMOKE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node tools/ci-smoke-built-desktop.mjs
          else
            node tools/ci-smoke-built-desktop.mjs
          fi

      - name: Build the Hardware Controls application
        if: matrix.slug == 'macos-arm64'
        shell: bash
        run: |
          config="$RUNNER_TEMP/tauri-hardware-release.json"
          node tools/write-tauri-artifact-config.mjs hardware "$config"
          npm run --prefix apps/light-hardware-controls tauri:build -- --target ${{ matrix.target }} --config "$config"

      - name: Stage release artifacts
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
          HEADLESS_BINARY: ${{ matrix.headless_binary }}
        run: |
          set -euo pipefail
          version="$LIGHT_RELEASE_VERSION"
          out=".artifacts/release"
          mkdir -p "$out"

          stage="$(mktemp -d)/light-headless-$version-$SLUG"
          mkdir -p "$stage"
          cp ".artifacts/build/cargo/$TARGET/release/$HEADLESS_BINARY" "$stage/"
          if [[ "$SLUG" == "linux-amd64" ]]; then
            cp ".artifacts/build/cargo/$TARGET/release/light-benchmark" "$stage/"
          fi
          cp -R assets/fixture-library "$stage/fixture-library"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$(dirname "$stage")" && 7z a -tzip "$OLDPWD/$out/light-headless-$version-$SLUG.zip" "$(basename "$stage")")
          else
            (cd "$(dirname "$stage")" && zip -q -r "$OLDPWD/$out/light-headless-$version-$SLUG.zip" "$(basename "$stage")")
          fi

          bundle=".artifacts/build/cargo/$TARGET/release/bundle"
          case "$SLUG" in
            macos-arm64)
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/ToskLight.app" "$out/tosklight-$version-macos-arm64.zip"
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/ToskLight Hardware Controls.app" \
                "$out/tosklight-hardware-controls-$version-macos-arm64.zip"
              ;;
            linux-amd64)
              cp "$bundle"/appimage/*.AppImage "$out/tosklight-$version-linux-amd64.AppImage"
              cp "$bundle"/deb/*.deb "$out/tosklight-$version-linux-amd64.deb"
              ;;
            linux-arm64)
              ;;
            windows-amd64)
              cp "$bundle"/nsis/*-setup.exe "$out/tosklight-$version-windows-amd64-setup.exe"
              ;;
          esac
          ls -la "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.slug }}
          path: .artifacts/release/*
          if-no-files-found: error

  pages-build:
    name: Documentation / Assemble static website
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [metadata, manual, visual-assets, release-performance]
    runs-on: ubuntu-22.04
    env:
      LIGHT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      LIGHT_REQUIRE_DEMO_VIDEO: "1"
      LIGHT_REUSE_MANUAL: "1"
      LIGHT_PERFORMANCE_STATUS_FILE: .artifacts/performance/status.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: operator-manual
          path: .artifacts/generated/manual

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: help-screenshots
          path: docs/help/assets/screenshots

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: product-demo
          path: .artifacts/test/visual-inspection/product-demo

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-performance
          path: .artifacts/performance

      - name: Assemble the public site
        run: npm run pages:generate

      - name: Resolve the assembled site directory
        id: site
        run: echo "path=$(npm run --silent artifact-path -- pages)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ steps.site.outputs.path }}

  release:
    name: Release / Tag and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - metadata
      - quality
      - unit
      - e2e
      - manual
      - visual-assets
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: .artifacts/release
          merge-multiple: true

      - name: Verify release artifacts and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for required in \
            "light-headless-$VERSION-macos-arm64.zip" \
            "tosklight-$VERSION-macos-arm64.zip" \
            "tosklight-hardware-controls-$VERSION-macos-arm64.zip" \
            "light-headless-$VERSION-linux-amd64.zip" \
            "tosklight-$VERSION-linux-amd64.AppImage" \
            "tosklight-$VERSION-linux-amd64.deb" \
            "light-headless-$VERSION-linux-arm64.zip" \
            "light-headless-$VERSION-windows-amd64.zip" \
            "tosklight-$VERSION-windows-amd64-setup.exe"
          do
            test -f ".artifacts/release/$required"
          done
          unzip -Z1 ".artifacts/release/light-headless-$VERSION-linux-amd64.zip" |
            grep -Eq '/light-benchmark$'
          (cd .artifacts/release && sha256sum * > SHA256SUMS)

      - name: Create the tag-only semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          LIGHT_EXPECTED_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          git diff --exit-code
          npm run release
          git diff --exit-code

      - name: Verify the published tag targets the tested commit
        if: needs.metadata.outputs.release == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA"

  release-performance:
    name: Release / Measure published artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [metadata, release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_CREATED: ${{ needs.metadata.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Measure the published release or reuse its latest status
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out=".artifacts/performance"
          mkdir -p "$out"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"

          if [[ "$RELEASE_CREATED" == "true" ]]; then
            archive="light-headless-${VERSION}-linux-amd64.zip"
            gh release download "v${VERSION}" --pattern "$archive" --dir "$RUNNER_TEMP"
            mkdir -p "$RUNNER_TEMP/release-performance"
            unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/release-performance"
            benchmark="$(find "$RUNNER_TEMP/release-performance" -type f -name light-benchmark -print -quit)"
            if [[ -n "$benchmark" ]]; then
              chmod +x "$benchmark"
              node tools/run-release-performance.mjs \
                --binary "$benchmark" \
                --output-dir "$out" \
                --version "$VERSION" \
                --commit "$GITHUB_SHA" \
                --release-url "$release_url" \
                --hardware-label "GitHub Actions ubuntu-22.04"
            fi

            if [[ ! -f "$out/status.json" ]]; then
              node -e '
                const fs = require("node:fs");
                fs.writeFileSync(process.argv[1], JSON.stringify({
                  schema_version: 1,
                  status: "unknown",
                  summary: "The published benchmark artifact could not be executed.",
                  generated_at: new Date().toISOString(),
                  release: { version: process.env.VERSION, commit: process.env.GITHUB_SHA, url: process.argv[2] }
                }, null, 2) + "\n");
              ' "$out/status.json" "$release_url"
            fi

            cp "$out/status.json" "$out/tosklight-performance-status-${VERSION}.json"
            (cd "$out" && zip -q "tosklight-performance-report-${VERSION}.zip" ./*.json ./*.log ./*.md 2>/dev/null || \
              zip -q "tosklight-performance-report-${VERSION}.zip" ./*.json)
            gh release upload "v${VERSION}" --clobber \
              "$out/tosklight-performance-status-${VERSION}.json#Performance status" \
              "$out/tosklight-performance-report-${VERSION}.zip#Detailed performance report"
          else
            gh release download "v${VERSION}" \
              --pattern "tosklight-performance-status-${VERSION}.json" \
              --dir "$out" || true
            if [[ -f "$out/tosklight-performance-status-${VERSION}.json" ]]; then
              cp "$out/tosklight-performance-status-${VERSION}.json" "$out/status.json"
            else
              node -e '
                const fs = require("node:fs");
                fs.writeFileSync(process.argv[1], JSON.stringify({
                  schema_version: 1,
                  status: "unknown",
                  summary: "No performance report is attached to the current release.",
                  generated_at: new Date().toISOString(),
                  release: { version: process.env.VERSION, commit: process.env.GITHUB_SHA, url: process.argv[2] }
                }, null, 2) + "\n");
              ' "$out/status.json" "$release_url"
            fi
          fi

          if [[ -f "$out/summary.md" ]]; then
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            node -e '
              const status = require("./" + process.argv[1]);
              console.log(`## Release performance\n\n**${status.status.toUpperCase()}** — ${status.summary}`);
            ' "$out/status.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Ensure a publishable performance status
        if: always()
        shell: bash
        run: |
          if [[ ! -f .artifacts/performance/status.json ]]; then
            mkdir -p .artifacts/performance
            node -e '
              const fs = require("node:fs");
              fs.writeFileSync(process.argv[1], JSON.stringify({
                schema_version: 1,
                status: "unknown",
                summary: "The performance assessment encountered an infrastructure error.",
                generated_at: new Date().toISOString(),
                release: {
                  version: process.env.VERSION,
                  commit: process.env.GITHUB_SHA,
                  url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/v${process.env.VERSION}`
                }
              }, null, 2) + "\n");
            ' .artifacts/performance/status.json
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-performance
          path: .artifacts/performance
          if-no-files-found: error

  pages-deploy:
    name: Documentation / Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pages-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
