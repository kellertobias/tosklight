name: CI and release

# Forgejo owns every branch. Its push mirror delivers those branch commits here.
# GitHub validates mirrored pushes and pull requests, then creates only v* release
# tags and hosted releases. It never creates or pushes a branch commit.
on:
  push:
    # A branch filter means tag pushes do not trigger this workflow.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-ci-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI needs diagnostics, but not multi-gigabyte native debug symbols. Keeping those symbols out
  # of dev/test artifacts materially shortens the comprehensive workspace and E2E link phases.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  frontends:
    name: Build / Shared web applications
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build every release frontend once
        run: |
          npm run build --prefix apps/light-desktop & desk=$!
          npm run --prefix apps/viz-editor build & previz=$!
          npm run build --prefix apps/media & media=$!
          wait "$desk"
          wait "$previz"
          wait "$media"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-frontends-${{ github.sha }}
          path: .artifacts/build/frontend
          if-no-files-found: error

  metadata:
    name: Release / Select version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Select the build and release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -1)"
          if [[ -n "$latest_tag" ]]; then
            version="${latest_tag#v}"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=false" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            LIGHT_RELEASE_OUTPUT="$GITHUB_OUTPUT" npm run release:dry-run
          fi

  quality:
    name: Checks / Linting
    needs: frontends
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: quality

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: ./.github/actions/package-mirror
        if: runner.os == 'Linux'

      - name: Install native Rust and desktop development files
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2; do
            if sudo timeout 180 apt-get update \
              && sudo timeout 600 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libudev-dev libasound2-dev build-essential; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-frontends-${{ github.sha }}
          path: .artifacts/build/frontend

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked

  unit:
    name: Tests / Unit and architecture
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run architecture checks
        run: npm run test:architecture

      # Rust setup may materialize Cargo bookkeeping. Keep all of it after the architecture gate,
      # whose first contract deliberately checks that checkout and npm left the root clean.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        if: github.ref != 'refs/heads/main'
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        if: github.ref != 'refs/heads/main'
        with:
          version: v0.17.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        if: github.ref != 'refs/heads/main'
        with:
          key: unit

      - uses: ./.github/actions/package-mirror
        if: runner.os == 'Linux'

      - name: Install Linux workspace development files
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        if: github.ref != 'refs/heads/main'
        run: |
          for attempt in 1 2; do
            if sudo timeout 180 apt-get update \
              && sudo timeout 600 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libudev-dev libasound2-dev libxdo-dev mesa-vulkan-drivers build-essential pkg-config; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Run TypeScript unit tests on release branches
        if: github.ref == 'refs/heads/main'
        run: npm run test:typescript-unit

      - name: Run TypeScript and focused Rust unit tests on non-release branches
        if: github.ref != 'refs/heads/main'
        env:
          TOSKLIGHT_EMBEDDED_PANE_WGPU_BACKEND: noop
        run: npm run test:unit

  workspace:
    name: Tests / Comprehensive Rust workspace
    if: github.ref == 'refs/heads/main'
    needs: frontends
    runs-on: ubuntu-22.04
    env:
      LIGHT_REUSE_FRONTEND_BUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-frontends-${{ github.sha }}
          path: .artifacts/build/frontend

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: workspace

      - uses: ./.github/actions/package-mirror
        if: runner.os == 'Linux'

      - name: Install Linux workspace development files
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2; do
            if sudo timeout 180 apt-get update \
              && sudo timeout 600 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libudev-dev libasound2-dev libxdo-dev mesa-vulkan-drivers build-essential pkg-config fonts-dejavu-core; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Run the GPU-less Rust workspace suite
        env:
          TOSKLIGHT_EMBEDDED_PANE_WGPU_BACKEND: noop
        run: |
          if output="$(bash tools/test.sh rust-workspace 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output" >&2
            output="$(printf '%s' "$output" | tail -c 3000)"
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            printf '::error title=Rust workspace failure::%s\n' "$output" >&2
            exit "$status"
          fi

  native-extension-draft:
    name: Tests / Native extension draft / ${{ matrix.label }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS
            runner: macos-14
          - label: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: native-extension-draft-${{ runner.os }}

      - name: Verify the draft contract and supervised child host
        run: cargo test -p light-extensions-contract -p light-extensions-host --locked

      - name: Lint the portable extension boundary
        run: cargo clippy -p light-extensions-contract -p light-extensions-host --all-targets --locked -- -D warnings

  usb-dmx:
    name: Tests / USB DMX / ${{ matrix.label }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: Linux
            runner: ubuntu-22.04
          - label: macOS
            runner: macos-14
          - label: Windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: usb-dmx-${{ runner.os }}

      - uses: ./.github/actions/package-mirror
        if: runner.os == 'Linux'

      - name: Install Linux USB serial development files
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2; do
            if sudo timeout 180 apt-get update \
              && sudo timeout 600 apt-get install -y libudev-dev pkg-config; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Verify USB DMX protocol and serial adapters
        run: cargo test -p light-usb-dmx-core -p light-usb-dmx-serial --locked

      - name: Lint USB DMX protocol and serial adapters
        run: cargo clippy -p light-usb-dmx-core -p light-usb-dmx-serial --all-targets --locked -- -D warnings

  e2e-build:
    name: Tests / Build Playwright application
    if: github.ref == 'refs/heads/main'
    needs: frontends
    runs-on: ubuntu-22.04
    env:
      LIGHT_REUSE_FRONTEND_BUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: e2e-build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-frontends-${{ github.sha }}
          path: .artifacts/build/frontend

      - uses: ./.github/actions/package-mirror
        if: runner.os == 'Linux'

      - name: Install USB serial and audio development files
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          for attempt in 1 2; do
            if sudo timeout 180 apt-get update \
              && sudo timeout 600 apt-get install -y libudev-dev libasound2-dev pkg-config; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Build the Playwright application once
        run: bash tools/test.sh e2e-build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-application-${{ github.sha }}
          path: .artifacts/build/cargo/debug/light-headless
          if-no-files-found: error

  e2e:
    name: Tests / Playwright / ${{ matrix.label }}
    if: github.ref == 'refs/heads/main'
    needs: e2e-build
    runs-on: ubuntu-22.04
    env:
      LIGHT_REUSE_E2E_BUILD: "1"
    strategy:
      fail-fast: true
      matrix:
        include:
          - { label: API, suite: api, shard: 1/1, artifact: api }
          - { label: UI (1/4), suite: ui, shard: 1/4, artifact: ui-1 }
          - { label: UI (2/4), suite: ui, shard: 2/4, artifact: ui-2 }
          - { label: UI (3/4), suite: ui, shard: 3/4, artifact: ui-3 }
          - { label: UI (4/4), suite: ui, shard: 4/4, artifact: ui-4 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - uses: ./.github/actions/package-mirror
        if: runner.os == 'Linux'

      - name: Install Chrome for Playwright
        # The runner's package mirrors go silent for hours at a time. Killing a stalled attempt
        # and starting over costs minutes; waiting for one costs the whole job. The cap has to
        # leave room for all three attempts, or the first stall consumes it alone.
        timeout-minutes: 35
        run: |
          for attempt in 1 2; do
            if timeout 900 npx playwright install --with-deps chrome; then exit 0; fi
            echo "Chrome install attempt $attempt stalled; retrying."
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
          done
          exit 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-application-${{ github.sha }}
          path: .artifacts/build/cargo/debug

      - name: Make the Playwright server executable
        run: chmod +x .artifacts/build/cargo/debug/light-headless

      # Each Playwright worker launches its own browser, Rust server, UDP listeners,
      # and isolated show. Keep one worker per runner to prevent local port/timing
      # contention; the matrix shards retain parallel throughput across runners.
      - name: Run Playwright shard
        run: |
          if output="$(npm run test:e2e-${{ matrix.suite }} -- --shard=${{ matrix.shard }} --workers=1 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output" >&2
            output="$(printf '%s' "$output" | tail -c 8000)"
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            printf '::error title=Playwright %s shard %s failure::%s\n' '${{ matrix.suite }}' '${{ matrix.shard }}' "$output" >&2
            exit "$status"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-${{ matrix.artifact }}
          path: |
            .artifacts/test/playwright-report
            .artifacts/test/results
          if-no-files-found: ignore

  demo-show:
    name: Release / Generate default demo show
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [metadata, e2e-build]
    runs-on: ubuntu-22.04
    env:
      LIGHT_REUSE_E2E_BUILD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-application-${{ github.sha }}
          path: .artifacts/build/cargo/debug

      - name: Make the Playwright server executable
        run: chmod +x .artifacts/build/cargo/debug/light-headless

      - name: Generate and validate the completed portable demo show through the API
        run: npm run test:demo-show

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: default-demo-show
          path: assets/demo.show
          if-no-files-found: error

  build:
    name: Build / Platform bundle / ${{ matrix.label }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Start expensive platform work as soon as the shared web inputs exist. Validation runs in
    # parallel and the release job remains the authority that requires every result.
    needs: [metadata, frontends]
    runs-on: ${{ matrix.runner }}
    env:
      LIGHT_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runner: macos-14
            target: aarch64-apple-darwin
            slug: macos-arm64
            headless_binary: light-headless
            desktop: true
            viz: true
          - label: Linux (x86_64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-amd64
            headless_binary: light-headless
            desktop: true
            viz: true
          - label: Linux (ARM64 / Raspberry Pi)
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            headless_binary: light-headless
            desktop: false
            cargo_flags: --no-default-features
          - label: Windows (x86_64)
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-amd64
            headless_binary: light-headless.exe
            desktop: true
            viz: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shared-frontends-${{ github.sha }}
          path: .artifacts/build/frontend

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.17.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - uses: ./.github/actions/package-mirror
        if: runner.os == 'Linux'

      - name: Install Linux bundling dependencies
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        if: runner.os == 'Linux' && matrix.desktop
        run: |
          for attempt in 1 2; do
            if sudo timeout 180 apt-get update \
              && sudo timeout 600 apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libudev-dev libasound2-dev libxdo-dev libxkbcommon-x11-0 mesa-vulkan-drivers vulkan-tools build-essential xvfb; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Install Linux ARM64 server dependencies
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        if: runner.os == 'Linux' && !matrix.desktop
        run: |
          for attempt in 1 2; do
            if sudo timeout 180 apt-get update \
              && sudo timeout 600 apt-get install -y libasound2-dev libudev-dev pkg-config zip; then
              exit 0
            fi
            echo "Package install attempt $attempt stalled; retrying." >&2
            # A killed install leaves dpkg mid-transaction and holding its lock, which fails
            # every later attempt for a reason that has nothing to do with the mirror.
            sudo pkill -9 -x apt-get || true
            sudo dpkg --configure -a || true
            # The runner's own mirror list has been silent for hours at a time. Packages stay
            # signature-checked against Ubuntu's keys wherever they come from, so pointing the
            # retry at a mirror on a different network costs nothing but changes the outcome.
            echo "http://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          done
          exit 1

      - name: Install workspace dependencies
        shell: bash
        run: npm ci

      # Cargo can schedule both independent application graphs across the runner when they are
      # selected in one invocation. Separate calls made the visualizer wait for all Headless work.
      - name: Build the Desk server, Stage renderer, and Media Server
        if: matrix.desktop
        shell: bash
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p light-headless --bin light-headless
          -p viz-renderer --bin viz-renderer
          -p media-server --bin media-server

      - name: Build the ARM64 Headless and Media servers
        if: '!matrix.desktop'
        shell: bash
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          ${{ matrix.cargo_flags }}
          -p light-headless --bin light-headless
          -p media-server --bin media-server

      - name: Validate the built Media Server configuration
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          ".artifacts/build/cargo/$TARGET/release/media-server$suffix" --check-configuration

      - name: Smoke-test the built Media Server startup
        shell: bash
        env:
          LIGHT_MEDIA_SMOKE_TARGET: ${{ matrix.target }}
        run: node tools/ci-smoke-media-server.mjs

      - name: Build the release performance probe
        if: matrix.slug == 'linux-amd64'
        shell: bash
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          --no-default-features -p light-headless --bin light-benchmark

      - name: Smoke-test the standalone visualizer
        if: matrix.viz
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=".exe"
          fi
          binary=".artifacts/build/cargo/$TARGET/release/viz-renderer$suffix"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a "$binary" --demo --verify
          else
            "$binary" --demo --verify
          fi

      - name: Stage the Desk server and Stage renderer sidecars
        if: matrix.desktop
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            suffix=".exe"
          fi
          sidecars="$(npm run --silent artifact-path -- tmp)/desktop-sidecars"
          mkdir -p "$sidecars"
          cp ".artifacts/build/cargo/$TARGET/release/light-headless$suffix" \
            "$sidecars/light-headless-$TARGET$suffix"
          cp ".artifacts/build/cargo/$TARGET/release/viz-renderer$suffix" \
            "$sidecars/viz-renderer-$TARGET$suffix"
          echo "LIGHT_DESKTOP_SIDECAR_DIR=$sidecars" >> "$GITHUB_ENV"
          echo "LIGHT_DESKTOP_SIDECAR_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Build the ToskLight desktop application
        if: matrix.desktop
        shell: bash
        run: |
          config="$(npm run --silent artifact-path -- tmp)/tauri-control-release.json"
          node tools/write-tauri-artifact-config.mjs control "$config"
          npm run --prefix apps/light-desktop tauri:build -- --target ${{ matrix.target }} --config "$config"

      - name: Seal the completed macOS Desk bundle
        if: matrix.desktop && matrix.slug == 'macos-arm64'
        shell: bash
        run: >-
          bash tools/seal-macos-app.sh
          ".artifacts/build/cargo/${{ matrix.target }}/release/bundle/macos/ToskLight.app"

      - name: Smoke-test the built desktop application
        if: matrix.desktop
        shell: bash
        env:
          LIGHT_DESKTOP_SMOKE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a node tools/ci-smoke-built-desktop.mjs
          else
            node tools/ci-smoke-built-desktop.mjs
          fi

      - name: Stage release artifacts
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
          HEADLESS_BINARY: ${{ matrix.headless_binary }}
        run: |
          set -euo pipefail
          version="$LIGHT_RELEASE_VERSION"
          out=".artifacts/release"
          tmp=".artifacts/tmp"
          mkdir -p "$out" "$tmp"

          stage_root="$(mktemp -d "$tmp/release-stage.XXXXXX")"
          trap 'rm -rf -- "$stage_root"' EXIT
          stage="$stage_root/light-headless-$version-$SLUG"
          mkdir -p "$stage"
          cp ".artifacts/build/cargo/$TARGET/release/$HEADLESS_BINARY" "$stage/"
          if [[ "$SLUG" == "linux-amd64" ]]; then
            cp ".artifacts/build/cargo/$TARGET/release/light-benchmark" "$stage/"
          fi
          cp -R assets/fixture-library "$stage/fixture-library"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$(dirname "$stage")" && 7z a -tzip "$OLDPWD/$out/light-headless-$version-$SLUG.zip" "$(basename "$stage")")
          else
            (cd "$(dirname "$stage")" && zip -q -r "$OLDPWD/$out/light-headless-$version-$SLUG.zip" "$(basename "$stage")")
          fi

          bundle=".artifacts/build/cargo/$TARGET/release/bundle"
          case "$SLUG" in
            macos-arm64)
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/ToskLight.app" "$out/tosklight-$version-macos-arm64.zip"
              ;;
            linux-amd64)
              cp "$bundle"/appimage/*.AppImage "$out/tosklight-$version-linux-amd64.AppImage"
              cp "$bundle"/deb/*.deb "$out/tosklight-$version-linux-amd64.deb"
              ;;
            linux-arm64) ;;
            windows-amd64)
              # Named rather than globbed: the Viz Editor writes its own installer into the same
              # directory, and a bare *-setup.exe would pick up whichever one it found first.
              cp "$bundle"/nsis/ToskLight_*-setup.exe "$out/tosklight-$version-windows-amd64-setup.exe"
              ;;
          esac
          ls -la "$out"

      # The API-generated show is produced once by the dedicated demo-show job. Stage that exact
      # artifact where the Tauri resource overlay expects it instead of regenerating it per target.
      - name: Stage the generated demo show for application bundles
        if: matrix.viz
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source tools/artifact-paths.sh
          light_init_artifact_paths "$PWD"
          demo_show=""
          for attempt in {1..60}; do
            attempt_dir="$LIGHT_TMP_DIR/default-demo-show-$attempt"
            mkdir -p "$attempt_dir"
            if gh run download "$GITHUB_RUN_ID" --name default-demo-show --dir "$attempt_dir"; then
              demo_show="$attempt_dir/demo.show"
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "error: default-demo-show was not available after 10 minutes" >&2
              exit 1
            fi
            sleep 10
          done
          [[ -f "$demo_show" ]] || {
            echo "error: downloaded default-demo-show did not contain demo.show" >&2
            exit 1
          }
          mkdir -p "$LIGHT_DEMO_SHOW_DIR"
          cp "$demo_show" "$LIGHT_DEMO_SHOW_DIR/demo-show.show"
          cp "$demo_show" .artifacts/release/demo.show

      - name: Build the ToskLight Viz Editor application
        if: matrix.viz
        shell: bash
        run: |
          config="$(npm run --silent artifact-path -- tmp)/tauri-viz-editor-release.json"
          node tools/write-tauri-artifact-config.mjs viz-editor "$config"
          bundle_args=(--no-bundle)
          case "$RUNNER_OS" in
            macOS) bundle_args=(--bundles app) ;;
          esac
          if output="$(npm run --prefix apps/viz-editor tauri:build -- \
            --target ${{ matrix.target }} --config "$config" "${bundle_args[@]}" 2>&1)"; then
            printf '%s\n' "$output"
          else
            status=$?
            printf '%s\n' "$output" >&2
            output="$(printf '%s' "$output" | tail -c 8000)"
            output="${output//'%'/'%25'}"
            output="${output//$'\r'/'%0D'}"
            output="${output//$'\n'/'%0A'}"
            printf '::error title=Viz Editor release build failure on %s::%s\n' "$RUNNER_OS" "$output" >&2
            exit "$status"
          fi

      - name: Smoke-test the ToskLight Viz Editor application
        if: matrix.viz
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TOSKLIGHT_VIZ_DEMO_SHOW: ${{ github.workspace }}/.artifacts/generated/demo-show/demo-show.show
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          binary=".artifacts/build/cargo/$TARGET/release/viz-editor$suffix"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a "$binary" --verify
          else
            "$binary" --verify
          fi

      - name: Stage the Viz release artifacts
        if: matrix.viz
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$LIGHT_RELEASE_VERSION"
          out=".artifacts/release"
          release=".artifacts/build/cargo/$TARGET/release"
          bundle="$release/bundle"
          mkdir -p "$out" ".artifacts/tmp"

          case "$SLUG" in
            macos-arm64)
              # Tauri builds the Rig Editor as the application. Its executable and resources are
              # kept aside, the bundle is reassembled with the renderer beside the editor, and the
              # resources go back: one product, the editor as its executable, the renderer as the
              # accessory it owns.
              editor_app="$bundle/macos/ToskLight Architect.app"
              accessory="$(mktemp -d ".artifacts/tmp/viz-accessory.XXXXXX")"
              cp "$editor_app/Contents/MacOS/ToskLight Architect" "$accessory/viz-editor"
              mkdir -p "$accessory/resources"
              cp -R "$editor_app/Contents/Resources/." "$accessory/resources/"
              bash tools/bundle-visualizer-macos.sh \
                "$accessory/viz-editor" "$release/viz-renderer" "$bundle/macos"
              cp "$release/light-headless" \
                "$bundle/macos/ToskLight Architect.app/Contents/MacOS/light-headless"
              cp -R "$accessory/resources/." \
                "$bundle/macos/ToskLight Architect.app/Contents/Resources/"
              bash tools/seal-macos-app.sh \
                "$bundle/macos/ToskLight Architect.app"
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/ToskLight Architect.app" \
                "$out/tosklight-architect-$version-macos-arm64.zip"
              ditto -c -k --sequesterRsrc --keepParent \
                "$bundle/macos/ToskLight Architect.app" \
                "$out/tosklight-viz-$version-macos-arm64.zip"
              ;;
            windows-amd64)
              stage_root="$(mktemp -d ".artifacts/tmp/viz-stage.XXXXXX")"
              trap 'rm -rf -- "$stage_root"' EXIT
              stage="$stage_root/tosklight-architect-$version-windows-amd64"
              mkdir -p "$stage"
              cp "$release/viz-renderer.exe" "$stage/"
              cp "$release/light-headless.exe" "$stage/"
              cp "$release/viz-editor.exe" "$stage/"
              (cd "$stage_root" && 7z a -tzip \
                "$OLDPWD/$out/tosklight-architect-$version-windows-amd64.zip" \
                "$(basename "$stage")")
              ;;
            linux-amd64)
              stage_root="$(mktemp -d ".artifacts/tmp/viz-stage.XXXXXX")"
              trap 'rm -rf -- "$stage_root"' EXIT
              stage="$stage_root/tosklight-architect-$version-linux-amd64"
              mkdir -p "$stage"
              cp "$release/viz-renderer" "$stage/"
              cp "$release/light-headless" "$stage/"
              cp "$release/viz-editor" "$stage/"
              (cd "$stage_root" && zip -q -r \
                "$OLDPWD/$out/tosklight-architect-$version-linux-amd64.zip" \
                "$(basename "$stage")")
              ;;
          esac
          ls -la "$out"

      - name: Stage the Media Server component
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$LIGHT_RELEASE_VERSION"
          out=".artifacts/release"
          tmp=".artifacts/tmp"
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          mkdir -p "$out" "$tmp"
          stage_root="$(mktemp -d "$tmp/media-component.XXXXXX")"
          trap 'rm -rf -- "$stage_root"' EXIT
          stage="$stage_root/tosklight-media-$version-$SLUG"
          mkdir -p "$stage"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            bash tools/bundle-media-macos.sh \
              ".artifacts/build/cargo/$TARGET/release/media-server" "$stage" "$version"
            bash tools/seal-macos-app.sh "$stage/ToskLight Media.app"
          else
            cp ".artifacts/build/cargo/$TARGET/release/media-server$suffix" "$stage/"
          fi
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd "$stage_root" && 7z a -tzip \
              "$OLDPWD/$out/tosklight-media-$version-$SLUG.zip" "$(basename "$stage")" >/dev/null)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$stage" "$out/tosklight-media-$version-$SLUG.zip"
          else
            (cd "$stage_root" && zip -q -r \
              "$OLDPWD/$out/tosklight-media-$version-$SLUG.zip" "$(basename "$stage")")
          fi

      - name: Assemble the operator-facing platform bundle
        shell: bash
        run: >-
          bash tools/assemble-release-bundle.sh
          ${{ matrix.slug }}
          ${{ needs.metadata.outputs.version }}
          .artifacts/release
          .artifacts/release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle-${{ matrix.slug }}
          path: .artifacts/release/tosklight-bundle-*.zip
          if-no-files-found: error

  release:
    name: Release / Tag and publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - metadata
      - quality
      - unit
      - workspace
      - native-extension-draft
      - usb-dmx
      - e2e
      - demo-show
      - build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: .artifacts/release
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: default-demo-show
          path: .artifacts/generated/demo-show

      - name: Verify release artifacts and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cp .artifacts/generated/demo-show/demo.show \
            .artifacts/release/assets-demo-show.show
          jq -n \
            --arg version "$VERSION" \
            --arg tag "v$VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg release_url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            '{version: $version, tag: $tag, commit: $commit, releaseUrl: $release_url}' \
            > .artifacts/release/report-release-metadata.json
          for required in \
            "tosklight-bundle-macos_arm64.zip" \
            "tosklight-bundle-linux_amd64.zip" \
            "tosklight-bundle-linux_arm64.zip" \
            "tosklight-bundle-windows_amd64.zip" \
            "assets-demo-show.show" \
            "report-release-metadata.json"
          do
            test -f ".artifacts/release/$required"
          done
          for slug in macos_arm64 linux_amd64 windows_amd64; do
            for product in desk headless previz media; do
              unzip -Z1 ".artifacts/release/tosklight-bundle-$slug.zip" |
                grep -F "tosklight-$product-$slug" >/dev/null
            done
          done
          for product in headless media; do
            unzip -Z1 .artifacts/release/tosklight-bundle-linux_arm64.zip |
              grep -F "tosklight-$product-linux_arm64" >/dev/null
          done
          for helper in light-headless viz-renderer; do
            unzip -Z1 .artifacts/release/tosklight-bundle-macos_arm64.zip |
              grep -F "tosklight-desk-macos_arm64.app/Contents/MacOS/$helper" >/dev/null
          done
          unzip -Z1 .artifacts/release/tosklight-bundle-macos_arm64.zip |
            grep -F "macos-first-start.txt" >/dev/null
          unzip -Z1 .artifacts/release/tosklight-bundle-macos_arm64.zip |
            grep -F "sign-macos-apps-locally.sh" >/dev/null
          unzip -Z1 .artifacts/release/tosklight-bundle-macos_arm64.zip |
            grep -F "tosklight-media-macos_arm64.app/Contents/MacOS/ToskLight Media" >/dev/null
          unzip -Z1 .artifacts/release/tosklight-bundle-linux_amd64.zip |
            grep -E '/light-benchmark$' >/dev/null
          (
            cd .artifacts/release
            find . -maxdepth 1 -type f ! -name report-checksums.txt -print0 |
              sort -z |
              xargs -0 sha256sum > report-checksums.txt
          )

      - name: Create the tag-only semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          LIGHT_EXPECTED_RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          git diff --exit-code
          npm run release
          git diff --exit-code

      - name: Verify the published tag targets the tested commit
        if: needs.metadata.outputs.release == 'true'
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          git fetch --force --tags origin
          test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA"
