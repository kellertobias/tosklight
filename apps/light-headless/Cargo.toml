[package]
name = "light-headless"
default-run = "light-headless"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[features]
default = ["native-audio-output"]
e2e-embedded-ui = ["light-headless-runtime/e2e-embedded-ui"]
native-audio-output = ["light-headless-runtime/native-audio-output"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
light-application.workspace = true
light-core = { path = "../../crates/shared/core" }
light-dynamics = { path = "../../crates/light/domain/dynamics" }
light-engine = { path = "../../crates/light/domain/engine", default-features = false }
light-fixture = { path = "../../crates/shared/fixture" }
light-headless-runtime = { path = "../../crates/light/adapters/headless", default-features = false }
light-output = { path = "../../crates/light/domain/output" }
light-playback = { path = "../../crates/light/domain/playback" }
light-programmer = { path = "../../crates/light/domain/programmer" }
light-show = { path = "../../crates/shared/show" }
light-wire.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
