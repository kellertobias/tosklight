[package]
name = "media-audio"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

# Audio capture. The analysis itself is platform-independent and lives in the domain; this is the
# part that is genuinely a platform adapter — opening a device and getting samples off its
# real-time callback without doing anything on that thread that could block it.
[dependencies]
arc-swap.workspace = true
cpal = "0.18.2"
crossbeam-queue = "0.3"
light-beat = { path = "../../../shared/beat" }
media-application = { path = "../../application" }
media-domain = { path = "../../domain" }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }

[lints]
workspace = true
