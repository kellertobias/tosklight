[package]
name = "media-runtime"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

# The Media Server's lifecycle adapter: configuration loading, logging, subsystem startup, and
# structured shutdown. `apps/media` is a thin process entry point over this crate.
[dependencies]
anyhow.workspace = true
axum.workspace = true
media-application = { path = "../../application" }
media-domain = { path = "../../domain" }
media-http = { path = "../http" }
media-library = { path = "../library" }
arc-swap.workspace = true
media-audio = { path = "../audio" }
media-citp = { path = "../citp" }
media-codec = { path = "../codec" }
media-net = { path = "../net" }
media-pixel = { path = "../pixel" }
media-playback = { path = "../playback" }
media-render = { path = "../render" }
media-text = { path = "../text" }
muda = { workspace = true, optional = true }
png.workspace = true
jpeg-encoder = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon = { workspace = true, optional = true }
winit.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, features = ["NSApplication", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow"] }
objc2-foundation = { version = "0.3.2", optional = true, features = ["NSArray", "NSString", "NSURL"] }

# The desktop presence is a menu bar item on macOS and a notification-area item on Windows. A
# server bundle has neither, and on Linux the tray pulls the whole GTK stack in behind it, so a
# headless target builds without it rather than linking a desktop it will never draw on.
[features]
default = ["tray"]
tray = ["dep:muda", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:rfd", "dep:tray-icon"]

[lints]
workspace = true
