[package]
name = "light-headless-runtime"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
default = ["native-audio-output"]
e2e-embedded-ui = ["rust-embed/debug-embed"]
native-audio-output = ["dep:cpal"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
jiff.workspace = true
futures-util.workspace = true
light-application.workspace = true
light-core = { path = "../../../shared/core" }
light-control = { path = "../../domain/control", default-features = false }
light-engine = { path = "../../domain/engine", default-features = false }
light-extensions-host = { path = "../extensions" }
light-extensions-contract = { path = "../../contracts/extensions" }
light-media = { path = "../media" }
light-mvr = { path = "../../../shared/mvr" }
light-psn-wire = { path = "../../../shared/psn" }
light-fixture = { path = "../../../shared/fixture" }
light-output = { path = "../../domain/output" }
light-usb-dmx-serial = { path = "../usb-dmx-serial" }
light-playback = { path = "../../domain/playback" }
light-programmer = { path = "../../domain/programmer" }
light-dynamics = { path = "../../domain/dynamics" }
light-discovery.workspace = true
light-show = { path = "../../../shared/show" }
light-wire.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tower-http.workspace = true
tower.workspace = true
http-body-util.workspace = true
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
async-io = "2"
embassy-futures = "0.1"
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
futures-lite = "2"
if-addrs = "0.15"
rand = { version = "0.8", features = ["std", "std_rng"] }
reqwest.workspace = true
rs-matter = { version = "0.2.0", features = ["async-io", "max-groups-per-fabric-12", "max-group-keys-per-fabric-2", "max-group-endpoints-per-fabric-3", "max-sessions-32"] }
socket2 = { version = "0.5", features = ["all"] }
cpal = { version = "0.16", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
xattr = "1.6"

[lints]
workspace = true
