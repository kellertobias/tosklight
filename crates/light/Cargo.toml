[package]
name = "light-application"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
chrono.workspace = true
jiff.workspace = true
light-core = { path = "../shared/core" }
light-dynamics = { path = "domain/dynamics" }
light-engine = { path = "domain/engine", default-features = false }
light-fixture = { path = "../shared/fixture" }
light-mvr = { path = "../shared/mvr" }
light-output = { path = "domain/output" }
light-playback = { path = "domain/playback" }
light-programmer = { path = "domain/programmer" }
light-show = { path = "../shared/show" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Pure-Rust MP3 import decoder. MPL-2.0; audit and file-level obligations are recorded in
# docs/engineering/timecode-audio-codec-decision.md. Runtime playback receives normalized WAV only.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
base64.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
