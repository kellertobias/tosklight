<svg xmlns="http://www.w3.org/2000/svg" width="960" height="284" viewBox="0 0 960 284" role="img" aria-labelledby="title"><title id="title">An upload becomes playable after conversion</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="284" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">An upload becomes playable after conversion</text><rect x="28.0" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Queued</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">Source accepted</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">Waiting to convert</text><path d="M309.6666666666667 139 L335.6666666666667 139" fill="none" stroke="#256b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340.6666666666667" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="99" font-size="22" font-weight="700" fill="#182333">Running</text><text x="358.6666666666667" y="132" font-size="20" font-weight="400" fill="#46566b">Watch progress</text><text x="358.6666666666667" y="161" font-size="20" font-weight="400" fill="#46566b">Cancel if necessary</text><path d="M622.3333333333334 139 L648.3333333333334 139" fill="none" stroke="#256b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="653.3333333333334" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="99" font-size="22" font-weight="700" fill="#182333">Ready / failed</text><text x="671.3333333333334" y="132" font-size="20" font-weight="400" fill="#46566b">Ready: preview the slot</text><text x="671.3333333333334" y="161" font-size="20" font-weight="400" fill="#46566b">Failed: read and fix reason</text><text x="28" y="257" font-size="19" font-weight="400" fill="#46566b">A replacement keeps the old playable file until its new conversion succeeds.</text></g></svg>
