<svg xmlns="http://www.w3.org/2000/svg" width="960" height="284" viewBox="0 0 960 284" role="img" aria-labelledby="title"><title id="title">Where Record accepts a playback target</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="284" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Where Record accepts a playback target</text><rect x="28.0" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Touch playback</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">Touch the visible tile</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">or playback section</text><rect x="340.6666666666667" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="99" font-size="22" font-weight="700" fill="#182333">Attached hardware</text><text x="358.6666666666667" y="132" font-size="20" font-weight="400" fill="#46566b">Press the topmost</text><text x="358.6666666666667" y="161" font-size="20" font-weight="400" fill="#46566b">configured button</text><rect x="653.3333333333334" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="99" font-size="22" font-weight="700" fill="#182333">Buttonless playback</text><text x="671.3333333333334" y="132" font-size="20" font-weight="400" fill="#46566b">Use its on-screen area</text><text x="671.3333333333334" y="161" font-size="20" font-weight="400" fill="#46566b">The fader stays live</text><text x="28" y="257" font-size="19" font-weight="400" fill="#46566b">Record suppresses the target’s normal button action. Moving a fader never records a Cue.</text></g></svg>
