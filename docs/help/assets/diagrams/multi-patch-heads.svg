<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="title"><title id="title">Physical copies and independently controlled heads</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="486" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Physical copies and independently controlled heads</text><rect x="28.0" y="66" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Multi-patch fixture 1</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">One logical fixture</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">One shared programmed look</text><path d="M466.0 139 L492.0 139" fill="none" stroke="#256b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="497.0" y="66" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="515.0" y="99" font-size="22" font-weight="700" fill="#182333">Physical copies</text><text x="515.0" y="132" font-size="20" font-weight="400" fill="#46566b">Different DMX addresses</text><text x="515.0" y="161" font-size="20" font-weight="400" fill="#46566b">Different rig placements</text><rect x="28.0" y="241" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="274" font-size="22" font-weight="700" fill="#182333">Multi-head fixture 100</text><text x="46.0" y="307" font-size="20" font-weight="400" fill="#46566b">100.0 · shared master</text><text x="46.0" y="336" font-size="20" font-weight="400" fill="#46566b">100.1 and 100.2 · heads</text><path d="M466.0 314 L492.0 314" fill="none" stroke="#256b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="497.0" y="241" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="515.0" y="274" font-size="22" font-weight="700" fill="#182333">Select each head</text><text x="515.0" y="307" font-size="20" font-weight="400" fill="#46566b">Separate programmable values</text><text x="515.0" y="336" font-size="20" font-weight="400" fill="#46566b">within the same fixture</text><text x="28" y="432" font-size="19" font-weight="400" fill="#46566b">Multi-patch creates more physical copies; logical heads provide independently selectable</text><text x="28" y="459" font-size="19" font-weight="400" fill="#46566b">parts.</text></g></svg>
