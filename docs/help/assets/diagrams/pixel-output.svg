<svg xmlns="http://www.w3.org/2000/svg" width="960" height="284" viewBox="0 0 960 284" role="img" aria-labelledby="title"><title id="title">Choose the output destination</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="284" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Choose the output destination</text><rect x="28.0" y="66" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Physical display</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">Choose monitor / fullscreen</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">Set resolution and rate</text><text x="46.0" y="190" font-size="20" font-weight="400" fill="#46566b">Verify the test pattern</text><rect x="497.0" y="66" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="515.0" y="99" font-size="22" font-weight="700" fill="#182333">Off-screen output</text><text x="515.0" y="132" font-size="20" font-weight="400" fill="#46566b">Choose no window</text><text x="515.0" y="161" font-size="20" font-weight="400" fill="#46566b">Still renders a canvas</text><text x="515.0" y="190" font-size="20" font-weight="400" fill="#46566b">Use previews or media surfaces</text><text x="28" y="257" font-size="19" font-weight="400" fill="#46566b">Check “Applies on restart” after changing settings, then restart before rehearsing output.</text></g></svg>
