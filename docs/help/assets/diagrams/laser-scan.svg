<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title"><title id="title">Laser figure, travel and visible beams</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="380" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Laser figure, travel and visible beams</text><rect x="40" y="170" width="105" height="80" rx="8" fill="#34465a"/><text x="36" y="285" font-size="21" font-weight="700" fill="#182333">Projector</text><path d="M145 210 L650 90 L820 260 Z" fill="#e5f1ed" stroke="none"/><path d="M145 210 L650 90 M145 210 L820 260" stroke="#78a58b" stroke-width="2"/><path d="M650 90 L760 95 L820 260" fill="none" stroke="#277a4c" stroke-width="7"/><path d="M820 260 L650 90" stroke="#68798a" stroke-width="3" stroke-dasharray="9 7"/><text x="292" y="157" font-size="23" font-weight="700" fill="#182333">Beam through haze</text><text x="686" y="66" font-size="23" font-weight="700" fill="#182333">Lit figure</text><text x="611" y="315" font-size="21" font-weight="400" fill="#182333">Dashed: travel with light off</text><text x="28" y="351" font-size="19" font-weight="400" fill="#46566b">Scan speed and persistence affect whether the moving beam reads as dots or a continuous figure.</text></g></svg>
