<svg xmlns="http://www.w3.org/2000/svg" width="960" height="311" viewBox="0 0 960 311" role="img" aria-labelledby="title"><title id="title">Pixel: verify the path to the real screen</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="311" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Pixel: verify the path to the real screen</text><rect x="28.0" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">1 · Output test</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">Select target display</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">Show the test pattern</text><path d="M309.6666666666667 139 L335.6666666666667 139" fill="none" stroke="#256b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="340.6666666666667" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="99" font-size="22" font-weight="700" fill="#182333">2 · Library</text><text x="358.6666666666667" y="132" font-size="20" font-weight="400" fill="#46566b">Upload an addressed slot</text><text x="358.6666666666667" y="161" font-size="20" font-weight="400" fill="#46566b">Wait for conversion</text><path d="M622.3333333333334 139 L648.3333333333334 139" fill="none" stroke="#256b82" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="653.3333333333334" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="99" font-size="22" font-weight="700" fill="#182333">3 · Playback</text><text x="671.3333333333334" y="132" font-size="20" font-weight="400" fill="#46566b">Raise layer and Master</text><text x="671.3333333333334" y="161" font-size="20" font-weight="400" fill="#46566b">Check physical output</text><text x="28" y="257" font-size="19" font-weight="400" fill="#46566b">A browser preview proves a rendered picture. The physical test pattern proves the display</text><text x="28" y="284" font-size="19" font-weight="400" fill="#46566b">path.</text></g></svg>
