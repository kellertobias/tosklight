<svg xmlns="http://www.w3.org/2000/svg" width="960" height="311" viewBox="0 0 960 311" role="img" aria-labelledby="title"><title id="title">One desk, several control surfaces</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="311" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">One desk, several control surfaces</text><rect x="28.0" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Main screen</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">One shared Programmer</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">and command line</text><rect x="340.6666666666667" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="99" font-size="22" font-weight="700" fill="#182333">Optional screens</text><text x="358.6666666666667" y="132" font-size="20" font-weight="400" fill="#46566b">Place the encoders</text><text x="358.6666666666667" y="161" font-size="20" font-weight="400" fill="#46566b">Choose playback positions</text><rect x="653.3333333333334" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="99" font-size="22" font-weight="700" fill="#182333">Page source</text><text x="671.3333333333334" y="132" font-size="20" font-weight="400" fill="#46566b">Own: select on this surface</text><text x="671.3333333333334" y="161" font-size="20" font-weight="400" fill="#46566b">Pinned: fixed page</text><text x="671.3333333333334" y="190" font-size="20" font-weight="400" fill="#46566b">Follow: another surface</text><text x="28" y="257" font-size="19" font-weight="400" fill="#46566b">A page change does not release held controls. Each held action releases its original</text><text x="28" y="284" font-size="19" font-weight="400" fill="#46566b">address.</text></g></svg>
