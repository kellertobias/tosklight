<svg xmlns="http://www.w3.org/2000/svg" width="960" height="459" viewBox="0 0 960 459" role="img" aria-labelledby="title"><title id="title">What is stored, and what reaches the stage</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="459" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">What is stored, and what reaches the stage</text><rect x="28.0" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Ordered selection</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">Chooses the targets</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">Does not set their values</text><rect x="340.6666666666667" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="99" font-size="22" font-weight="700" fill="#182333">Programmer values</text><text x="358.6666666666667" y="132" font-size="20" font-weight="400" fill="#46566b">Temporary working values</text><text x="358.6666666666667" y="161" font-size="20" font-weight="400" fill="#46566b">Record / Update to store</text><rect x="653.3333333333334" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="99" font-size="22" font-weight="700" fill="#182333">Stored programming</text><text x="671.3333333333334" y="132" font-size="20" font-weight="400" fill="#46566b">Groups, Presets and Cues</text><text x="671.3333333333334" y="161" font-size="20" font-weight="400" fill="#46566b">Selection alone is a Group</text><rect x="28.0" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="274" font-size="22" font-weight="700" fill="#182333">Playback values</text><text x="46.0" y="307" font-size="20" font-weight="400" fill="#46566b">Running Cues contribute</text><text x="46.0" y="336" font-size="20" font-weight="400" fill="#46566b">after clearing Programmer</text><rect x="340.6666666666667" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="274" font-size="22" font-weight="700" fill="#182333">Resolved output</text><text x="358.6666666666667" y="307" font-size="20" font-weight="400" fill="#46566b">Combines eligible sources</text><text x="358.6666666666667" y="336" font-size="20" font-weight="400" fill="#46566b">and output masters</text><rect x="653.3333333333334" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="274" font-size="22" font-weight="700" fill="#182333">Highlight / Low Light</text><text x="671.3333333333334" y="307" font-size="20" font-weight="400" fill="#46566b">Temporary identification</text><text x="671.3333333333334" y="336" font-size="20" font-weight="400" fill="#46566b">Never recorded into a Cue</text><text x="28" y="432" font-size="19" font-weight="400" fill="#46566b">A visible look can include playback or Highlight. Record captures Programmer values only.</text></g></svg>
