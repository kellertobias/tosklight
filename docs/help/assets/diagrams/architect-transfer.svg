<svg xmlns="http://www.w3.org/2000/svg" width="960" height="459" viewBox="0 0 960 459" role="img" aria-labelledby="title"><title id="title">Architect: documents and live values</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="459" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Architect: documents and live values</text><rect x="28.0" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Architect document</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">Plan fixtures and venue</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">Save a portable .show</text><rect x="340.6666666666667" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="99" font-size="22" font-weight="700" fill="#182333">Control show</text><text x="358.6666666666667" y="132" font-size="20" font-weight="400" fill="#46566b">Load / publish a copy</text><text x="358.6666666666667" y="161" font-size="20" font-weight="400" fill="#46566b">Rig edits synchronize</text><rect x="653.3333333333334" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="99" font-size="22" font-weight="700" fill="#182333">Renderer</text><text x="671.3333333333334" y="132" font-size="20" font-weight="400" fill="#46566b">Draw the rig from its source</text><text x="671.3333333333334" y="161" font-size="20" font-weight="400" fill="#46566b">Local picture settings</text><rect x="28.0" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="274" font-size="22" font-weight="700" fill="#182333">Editor preview</text><text x="46.0" y="307" font-size="20" font-weight="400" fill="#46566b">Temporary selected-fixture</text><text x="46.0" y="336" font-size="20" font-weight="400" fill="#46566b">values; no Cues stored</text><rect x="340.6666666666667" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="274" font-size="22" font-weight="700" fill="#182333">Art-Net / sACN</text><text x="358.6666666666667" y="307" font-size="20" font-weight="400" fill="#46566b">Real received DMX takes</text><text x="358.6666666666667" y="336" font-size="20" font-weight="400" fill="#46566b">over each arriving universe</text><rect x="653.3333333333334" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="274" font-size="22" font-weight="700" fill="#182333">Live picture</text><text x="671.3333333333334" y="307" font-size="20" font-weight="400" fill="#46566b">Input mappings choose</text><text x="671.3333333333334" y="336" font-size="20" font-weight="400" fill="#46566b">where the values arrive</text><text x="28" y="432" font-size="19" font-weight="400" fill="#46566b">Save As breaks the local follow binding. DMX values do not become document edits.</text></g></svg>
