<svg xmlns="http://www.w3.org/2000/svg" width="960" height="459" viewBox="0 0 960 459" role="img" aria-labelledby="title"><title id="title">Resolve sources into fixture output</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="459" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Resolve sources into fixture output</text><rect x="28.0" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">Playback Intensity</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">HTP: highest eligible</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">contribution wins</text><rect x="340.6666666666667" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="99" font-size="22" font-weight="700" fill="#182333">Colour / Position</text><text x="358.6666666666667" y="132" font-size="20" font-weight="400" fill="#46566b">LTP: latest eligible owner</text><text x="358.6666666666667" y="161" font-size="20" font-weight="400" fill="#46566b">within priority rules</text><rect x="653.3333333333334" y="66" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="99" font-size="22" font-weight="700" fill="#182333">Programmer</text><text x="671.3333333333334" y="132" font-size="20" font-weight="400" fill="#46566b">Inspect temporary values</text><text x="671.3333333333334" y="161" font-size="20" font-weight="400" fill="#46566b">Clear to prove playback</text><rect x="28.0" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="274" font-size="22" font-weight="700" fill="#182333">Release a source</text><text x="46.0" y="307" font-size="20" font-weight="400" fill="#46566b">Its ownership ends</text><text x="46.0" y="336" font-size="20" font-weight="400" fill="#46566b">Underlying sources return</text><rect x="340.6666666666667" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="358.6666666666667" y="274" font-size="22" font-weight="700" fill="#182333">Masters and Blackout</text><text x="358.6666666666667" y="307" font-size="20" font-weight="400" fill="#46566b">Apply the relevant</text><text x="358.6666666666667" y="336" font-size="20" font-weight="400" fill="#46566b">fixture/output rules</text><rect x="653.3333333333334" y="241" width="278.6666666666667" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="671.3333333333334" y="274" font-size="22" font-weight="700" fill="#182333">Final output</text><text x="671.3333333333334" y="307" font-size="20" font-weight="400" fill="#46566b">Inspect Fixture Sheet</text><text x="671.3333333333334" y="336" font-size="20" font-weight="400" fill="#46566b">and actual DMX values</text><text x="28" y="432" font-size="19" font-weight="400" fill="#46566b">Programmer edits use their normal LTP semantics; playback HTP is not a Programmer rule.</text></g></svg>
