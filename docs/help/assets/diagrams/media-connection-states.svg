<svg xmlns="http://www.w3.org/2000/svg" width="960" height="486" viewBox="0 0 960 486" role="img" aria-labelledby="title"><title id="title">Read Media connection states</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#256b82" stroke-width="1.8"/></marker></defs><rect width="960" height="486" rx="14" fill="#fff"/><g font-family="sans-serif"><text x="28" y="40" font-size="27" font-weight="700" fill="#182333">Read Media connection states</text><rect x="28.0" y="66" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="99" font-size="22" font-weight="700" fill="#182333">No fixture patched</text><text x="46.0" y="132" font-size="20" font-weight="400" fill="#46566b">No Media layers available</text><text x="46.0" y="161" font-size="20" font-weight="400" fill="#46566b">Use Open Patch</text><rect x="497.0" y="66" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="515.0" y="99" font-size="22" font-weight="700" fill="#182333">Patched, no CITP</text><text x="515.0" y="132" font-size="20" font-weight="400" fill="#46566b">Numeric programming works</text><text x="515.0" y="161" font-size="20" font-weight="400" fill="#46566b">No names or thumbnails</text><rect x="28.0" y="241" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="46.0" y="274" font-size="22" font-weight="700" fill="#182333">CITP connected</text><text x="46.0" y="307" font-size="20" font-weight="400" fill="#46566b">Names, thumbnails</text><text x="46.0" y="336" font-size="20" font-weight="400" fill="#46566b">and live previews available</text><rect x="497.0" y="241" width="435.0" height="145" rx="10" fill="#f1f6f8" stroke="#a8bbc5" stroke-width="1.5"/><text x="515.0" y="274" font-size="22" font-weight="700" fill="#182333">Server offline</text><text x="515.0" y="307" font-size="20" font-weight="400" fill="#46566b">Check power and network</text><text x="515.0" y="336" font-size="20" font-weight="400" fill="#46566b">Cue previews name the loss</text><text x="28" y="432" font-size="19" font-weight="400" fill="#46566b">Art-Net / sACN controls playback. CITP supplies feedback; HTTP supplies native</text><text x="28" y="459" font-size="19" font-weight="400" fill="#46566b">controls/previews.</text></g></svg>
