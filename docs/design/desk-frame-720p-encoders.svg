<?xml version="1.0" encoding="UTF-8"?>
<!-- Editable 1280x720 compact desk-frame concept. Encoder row stays visible. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ToskLight desk frame at 720p with encoders</title>
  <desc id="desc">Compact dark lighting desk frame retaining six visible software encoders.</desc>
  <defs><style>.p{fill:#11171c;stroke:#35434e}.i{fill:#161e24;stroke:#3b4d58}.b{fill:#202a31;stroke:#40515d}.a{fill:#103545;stroke:#53c4df;stroke-width:1.5}.l{fill:#aebdc6;font:11px system-ui,sans-serif}.s{fill:#82939d;font:9px system-ui,sans-serif}.t{fill:#edf6f8;font:600 12px system-ui,sans-serif}.h{fill:#edf6f8;font:700 15px system-ui,sans-serif}.v{fill:#dff8ff;font:700 16px system-ui,sans-serif}</style></defs>
  <g id="desk-frame-720p"><rect width="1280" height="720" fill="#090d11"/>
    <g id="show-bar"><rect class="p" width="1280" height="42"/><text class="h" x="13" y="26">ToskLight</text><text class="s" x="95" y="25">Demo Show · Main Desk</text><rect class="a" x="390" y="8" width="95" height="25" rx="3"/><text class="t" x="438" y="25" text-anchor="middle">PROGRAMMER</text><circle cx="1080" cy="21" r="4" fill="#65ce98"/><text class="s" x="1090" y="25">Output</text><rect class="b" x="1180" y="8" width="86" height="25" rx="3"/><text class="t" x="1223" y="25" text-anchor="middle">Setup</text></g>
    <g id="dock"><rect class="p" x="0" y="42" width="48" height="468"/><rect class="a" x="7" y="53" width="34" height="34" rx="4"/><rect class="b" x="7" y="95" width="34" height="34" rx="4"/><rect class="b" x="7" y="137" width="34" height="34" rx="4"/><rect class="b" x="7" y="179" width="34" height="34" rx="4"/><text class="s" x="24" y="75" text-anchor="middle">FIX</text><text class="s" x="24" y="117" text-anchor="middle">GRP</text><text class="s" x="24" y="159" text-anchor="middle">PRE</text><text class="s" x="24" y="201" text-anchor="middle">DYN</text></g>
    <g id="fixture-sheet"><rect class="p" x="48" y="42" width="748" height="300"/><text class="h" x="62" y="66">Fixture Sheet</text><text class="s" x="62" y="81">12 selected</text><rect class="i" x="62" y="94" width="720" height="25"/><g class="s"><text x="72" y="110">ID</text><text x="112" y="110">NAME</text><text x="285" y="110">INTENSITY</text><text x="395" y="110">COLOR</text><text x="490" y="110">POSITION</text><text x="650" y="110">BEAM</text></g><g class="l"><rect x="62" y="120" width="720" height="34" fill="#183541"/><text x="72" y="142">1</text><text x="112" y="142">Front Wash L</text><text x="285" y="142">72%</text><circle cx="416" cy="137" r="8" fill="#9fc8ff"/><text x="490" y="142">32° / 48°</text><text x="650" y="142">42°</text><rect x="62" y="155" width="720" height="34" fill="#12191e"/><text x="72" y="177">2</text><text x="112" y="177">Front Wash R</text><text x="285" y="177">72%</text><circle cx="416" cy="172" r="8" fill="#9fc8ff"/><text x="490" y="177">-32° / 48°</text><text x="650" y="177">42°</text><rect x="62" y="190" width="720" height="34" fill="#151d23"/><text x="72" y="212">3</text><text x="112" y="212">Back Spot 1</text><text x="285" y="212">0%</text><circle cx="416" cy="207" r="8" fill="#ffbc57"/><text x="490" y="212">0° / 65°</text><text x="650" y="212">18°</text></g></g>
    <g id="stage"><rect class="p" x="796" y="42" width="484" height="300"/><text class="h" x="810" y="66">Stage</text><rect x="810" y="82" width="456" height="246" rx="3" fill="#142a39"/><path d="M825 290L920 205 1000 250 1085 145 1250 290" fill="none" stroke="#65ce98" stroke-width="3"/><g fill="#e9f7ff" stroke="#55c2dc" stroke-width="2"><circle cx="920" cy="205" r="9"/><circle cx="1000" cy="250" r="9"/><circle cx="1085" cy="145" r="9"/></g></g>
    <g id="playbacks"><rect class="p" x="48" y="342" width="1232" height="168"/><text class="h" x="62" y="366">Playbacks</text><g id="playback-cards"><g transform="translate(62 380)"><rect class="a" width="175" height="113" rx="4"/><text class="s" x="10" y="18">PB 1</text><text class="t" x="10" y="42">Opening Look</text><rect x="10" y="55" width="155" height="34" fill="#55c2dc" opacity=".55"/><text class="t" x="88" y="106" text-anchor="middle">GO</text></g><g transform="translate(250 380)"><rect class="b" width="175" height="113" rx="4"/><text class="s" x="10" y="18">PB 2</text><text class="t" x="10" y="42">Verse</text><rect x="10" y="55" width="155" height="34" fill="#513d77"/><text class="t" x="88" y="106" text-anchor="middle">GO</text></g><g transform="translate(438 380)"><rect class="b" width="175" height="113" rx="4"/><text class="s" x="10" y="18">PB 3</text><text class="t" x="10" y="42">Chorus</text><rect x="10" y="55" width="155" height="34" fill="#6b3b45"/><text class="t" x="88" y="106" text-anchor="middle">GO</text></g><g transform="translate(626 380)"><rect class="b" width="175" height="113" rx="4"/><text class="s" x="10" y="18">PB 4</text><text class="t" x="10" y="42">Blackout</text><rect x="10" y="55" width="155" height="34" fill="#2a2f36"/><text class="t" x="88" y="106" text-anchor="middle">GO</text></g></g></g>
    <g id="command-line"><rect class="p" x="0" y="510" width="1280" height="48"/><text class="s" x="12" y="528">COMMAND</text><rect class="i" x="12" y="533" width="785" height="18" rx="2"/><text class="t" x="22" y="547">Fixture 1 Thru 12 At 72</text><rect class="b" x="1060" y="521" width="90" height="27" rx="3"/><text class="t" x="1105" y="539" text-anchor="middle">CLEAR</text><rect x="1160" y="521" width="90" height="27" rx="3" fill="#174e39" stroke="#65ce98"/><text class="t" x="1205" y="539" text-anchor="middle">ENTER</text></g>
    <g id="software-encoders"><rect class="p" x="0" y="558" width="1280" height="162"/><text class="s" x="12" y="576">PROGRAMMER ENCODERS · POSITION / BEAM</text>
      <g id="encoder-1" transform="translate(12 590)"><rect class="i" width="198" height="116" rx="4"/><text class="s" x="10" y="18">ENC 1</text><text class="t" x="10" y="42">Pan</text><text class="v" x="187" y="42" text-anchor="end">32°</text><rect x="10" y="57" width="178" height="7" rx="3" fill="#31434d"/><rect x="10" y="57" width="104" height="7" rx="3" fill="#55c2dc"/><circle cx="114" cy="60.5" r="8" fill="#dff8ff" stroke="#55c2dc" stroke-width="2"/><text class="s" x="10" y="91">Turn · Press-turn fine</text></g>
      <g id="encoder-2" transform="translate(222 590)"><rect class="i" width="198" height="116" rx="4"/><text class="s" x="10" y="18">ENC 2</text><text class="t" x="10" y="42">Tilt</text><text class="v" x="187" y="42" text-anchor="end">48°</text><rect x="10" y="57" width="178" height="7" rx="3" fill="#31434d"/><rect x="10" y="57" width="121" height="7" rx="3" fill="#55c2dc"/><circle cx="131" cy="60.5" r="8" fill="#dff8ff" stroke="#55c2dc" stroke-width="2"/><text class="s" x="10" y="91">Turn · Press-turn fine</text></g>
      <g id="encoder-3" transform="translate(432 590)"><rect class="i" width="198" height="116" rx="4"/><text class="s" x="10" y="18">ENC 3</text><text class="t" x="10" y="42">Zoom</text><text class="v" x="187" y="42" text-anchor="end">42°</text><rect x="10" y="57" width="178" height="7" rx="3" fill="#31434d"/><rect x="10" y="57" width="76" height="7" rx="3" fill="#b278e8"/><circle cx="86" cy="60.5" r="8" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="s" x="10" y="91">Turn</text></g>
      <g id="encoder-4" transform="translate(642 590)"><rect class="i" width="198" height="116" rx="4"/><text class="s" x="10" y="18">ENC 4</text><text class="t" x="10" y="42">Focus</text><text class="v" x="187" y="42" text-anchor="end">Sharp</text><rect x="10" y="57" width="178" height="7" rx="3" fill="#31434d"/><rect x="10" y="57" width="156" height="7" rx="3" fill="#b278e8"/><circle cx="166" cy="60.5" r="8" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="s" x="10" y="91">Turn</text></g>
      <g id="encoder-5" transform="translate(852 590)"><rect class="i" width="198" height="116" rx="4"/><text class="s" x="10" y="18">ENC 5</text><text class="t" x="10" y="42">Iris</text><text class="v" x="187" y="42" text-anchor="end">Open</text><rect x="10" y="57" width="178" height="7" rx="3" fill="#31434d"/><circle cx="178" cy="60.5" r="8" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="s" x="10" y="91">Turn</text></g>
      <g id="encoder-6" transform="translate(1062 590)"><rect class="i" width="206" height="116" rx="4"/><text class="s" x="10" y="18">ENC 6</text><text class="t" x="10" y="42">Gobo</text><text class="v" x="196" y="42" text-anchor="end">Open</text><rect x="10" y="57" width="186" height="7" rx="3" fill="#31434d"/><circle cx="186" cy="60.5" r="8" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="s" x="10" y="91">Turn · Press choices</text></g>
    </g>
  </g>
</svg>
