<?xml version="1.0" encoding="UTF-8"?>
<!-- Editable component sheet based on the Preset Pools and Dynamics Storybook surfaces. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ToskLight Storybook pool and Dynamics components</title>
  <desc id="desc">Editable component sheet with empty and filled preset cards, phase settings, and a Dynamics lane settings menu.</desc>
  <defs><style>.page{fill:#0b1014}.panel{fill:#11171c;stroke:#35434e;stroke-width:1}.inner{fill:#161e24;stroke:#40515d;stroke-width:1}.button{fill:#202a31;stroke:#40515d;stroke-width:1}.active{fill:#103545;stroke:#53c4df;stroke-width:1.5}.label{fill:#aebdc6;font:12px system-ui,sans-serif}.small{fill:#82939d;font:10px system-ui,sans-serif}.title{fill:#edf6f8;font:600 14px system-ui,sans-serif}.head{fill:#edf6f8;font:700 18px system-ui,sans-serif}.value{fill:#dff8ff;font:600 15px system-ui,sans-serif}.accent{fill:#55c2dc}.green{fill:#65ce98}</style></defs>
  <rect class="page" width="1600" height="1000"/>
  <text class="head" x="38" y="44">Storybook components · Preset Pools and Dynamics</text><text class="small" x="38" y="65">Editable design sheet; each component is a separate named group.</text>
  <g id="preset-pool-components">
    <text class="head" x="38" y="115">Preset Pool cards</text><text class="small" x="38" y="135">Color family · square card variants</text>
    <g id="empty-preset"><rect class="panel" x="38" y="154" width="270" height="270" rx="6"/><text class="small" x="55" y="179">COLOR 4</text><rect x="55" y="197" width="236" height="150" rx="4" fill="#151c22" stroke="#40515d" stroke-dasharray="5 4"/><path d="M173 244v55M145 272h56" stroke="#657782" stroke-width="3"/><text class="title" x="173" y="378" text-anchor="middle">Empty</text><text class="small" x="173" y="399" text-anchor="middle">Tap to record programmer</text></g>
    <g id="filled-preset"><rect class="panel" x="326" y="154" width="270" height="270" rx="6"/><rect x="327" y="155" width="268" height="7" rx="3" fill="#4ca8d9"/><text class="small" x="343" y="179">COLOR 5</text><rect x="343" y="197" width="236" height="150" rx="4" fill="#25475e"/><circle cx="461" cy="270" r="58" fill="#8ed7ff"/><path d="M343 322l50-46 39 30 45-67 52 48 50-42v102H343z" fill="#0d1b27" fill-opacity=".7"/><text class="title" x="343" y="378">Ice Blue Wash</text><text class="small" x="343" y="399">Color · 12 fixtures</text><circle class="green" cx="561" cy="378" r="5"/></g>
    <g id="preset-pool-header-example"><rect class="panel" x="38" y="448" width="558" height="52" rx="5"/><text class="title" x="55" y="480">Color Presets</text><rect class="active" x="228" y="459" width="68" height="30" rx="3"/><text class="label" x="262" y="479" text-anchor="middle">Color</text><rect class="button" x="302" y="459" width="83" height="30" rx="3"/><text class="label" x="344" y="479" text-anchor="middle">Position</text><rect class="button" x="391" y="459" width="74" height="30" rx="3"/><text class="label" x="428" y="479" text-anchor="middle">Beam</text><rect class="button" x="490" y="459" width="89" height="30" rx="3"/><text class="label" x="535" y="479" text-anchor="middle">Groups</text></g>
  </g>
  <g id="dynamics-phase-settings">
    <text class="head" x="650" y="115">Dynamics · Phase settings</text><text class="small" x="650" y="135">PhaseView · per-Dynamic configuration state</text>
    <rect class="panel" x="650" y="154" width="912" height="400" rx="6"/><text class="title" x="670" y="184">Phase</text><text class="small" x="670" y="204">Linear ordering across the current selection</text>
    <g id="phase-ordering"><text class="label" x="670" y="235">Ordering mode</text><rect class="active" x="670" y="244" width="92" height="34" rx="3"/><text class="title" x="716" y="266" text-anchor="middle">Linear</text><rect class="button" x="767" y="244" width="74" height="34" rx="3"/><text class="label" x="804" y="266" text-anchor="middle">Grid</text><rect class="button" x="846" y="244" width="85" height="34" rx="3"/><text class="label" x="888" y="266" text-anchor="middle">Radial</text><rect class="button" x="936" y="244" width="80" height="34" rx="3"/><text class="label" x="976" y="266" text-anchor="middle">Radar</text><rect class="button" x="1021" y="244" width="91" height="34" rx="3"/><text class="label" x="1067" y="266" text-anchor="middle">Random</text></g>
    <g id="phase-fields"><g id="phase-offset"><text class="label" x="670" y="322">Offset</text><rect class="inner" x="670" y="331" width="175" height="42" rx="3"/><text class="value" x="686" y="358">0</text><text class="small" x="822" y="358">°</text></g><g id="phase-span"><text class="label" x="864" y="322">Span</text><rect class="inner" x="864" y="331" width="175" height="42" rx="3"/><text class="value" x="880" y="358">360</text><text class="small" x="1016" y="358">°</text></g><g id="phase-blocks"><text class="label" x="1058" y="322">Blocks</text><rect class="inner" x="1058" y="331" width="175" height="42" rx="3"/><text class="value" x="1074" y="358">1</text></g><g id="phase-repeats"><text class="label" x="1252" y="322">Repeats</text><rect class="inner" x="1252" y="331" width="175" height="42" rx="3"/><text class="value" x="1268" y="358">1</text></g>
      <g id="phase-wings"><text class="label" x="670" y="418">Wings</text><rect x="670" y="428" width="56" height="27" rx="14" fill="#254a5a" stroke="#55c2dc"/><circle cx="712" cy="441.5" r="10" fill="#dff8ff"/><text class="small" x="736" y="446">On</text></g><g id="phase-anchors"><text class="label" x="864" y="418">Explicit anchors</text><rect class="inner" x="864" y="428" width="370" height="42" rx="3"/><text class="small" x="880" y="454">Automatic</text></g></g>
    <g id="phase-footer"><rect class="button" x="670" y="500" width="122" height="34" rx="3"/><text class="title" x="731" y="522" text-anchor="middle">Take Selection</text><rect class="button" x="800" y="500" width="120" height="34" rx="3"/><text class="title" x="860" y="522" text-anchor="middle">Clear Selection</text><text class="small" x="1137" y="492">Phase span presets</text><rect class="button" x="1137" y="500" width="64" height="34" rx="3"/><text class="label" x="1169" y="522" text-anchor="middle">180°</text><rect class="active" x="1206" y="500" width="64" height="34" rx="3"/><text class="label" x="1238" y="522" text-anchor="middle">360°</text><rect class="button" x="1275" y="500" width="64" height="34" rx="3"/><text class="label" x="1307" y="522" text-anchor="middle">720°</text></g>
  </g>
  <g id="dynamics-lane-settings">
    <text class="head" x="38" y="590">Dynamics · Lane settings</text><text class="small" x="38" y="610">CurvesViewSurface · selected lane with its gear menu open</text>
    <rect class="panel" x="38" y="630" width="1524" height="310" rx="6"/><g id="lane-row"><rect x="58" y="654" width="1040" height="112" rx="4" fill="#173541" stroke="#55c2dc" stroke-width="1.5"/><text class="small" x="78" y="681">LANE 1</text><text class="head" x="78" y="710">Dimmer</text><text class="small" x="78" y="733">Sine · 1.00×</text><g id="lane-curve"><rect x="278" y="671" width="790" height="78" fill="#10171c" stroke="#334650"/><path d="M278 690h790M278 710h790M278 730h790M475 671v78M673 671v78M870 671v78" stroke="#35515c" stroke-width="1" opacity=".65"/><path d="M278 710 C343 670 409 670 475 710 S607 750 673 710 S805 670 870 710 S1002 750 1068 710" fill="none" stroke="#55c2dc" stroke-width="3"/><path d="M475 671v78" stroke="#ffcb65" stroke-width="2" stroke-dasharray="4 4"/></g><g id="lane-settings-button"><rect class="active" x="1118" y="684" width="46" height="46" rx="4"/><text x="1141" y="715" fill="#dff8ff" font-family="system-ui,sans-serif" font-size="22" text-anchor="middle">⚙</text></g></g>
    <g id="lane-settings-menu"><rect x="1115" y="654" width="285" height="190" rx="5" fill="#202a31" stroke="#5c707c" stroke-width="1.5"/><text class="title" x="1134" y="681">Dimmer lane menu</text><rect class="inner" x="1128" y="696" width="259" height="43" rx="3"/><text x="1142" y="723" fill="#dce8ec" font-family="system-ui,sans-serif" font-size="13">✎  Change attribute</text><rect x="1128" y="746" width="259" height="43" rx="3" fill="#3a2026" stroke="#8a4a55"/><text x="1142" y="773" fill="#ffb9c0" font-family="system-ui,sans-serif" font-size="13">⌫  Delete lane</text><text class="small" x="1134" y="820">A Dynamic requires at least one lane.</text><rect class="button" x="1354" y="666" width="26" height="26" rx="3"/><text class="label" x="1367" y="684" text-anchor="middle">×</text></g>
    <g id="lane-composer-summary"><text class="title" x="78" y="815">Curve Composer</text><rect class="active" x="78" y="830" width="92" height="32" rx="3"/><text class="label" x="124" y="851" text-anchor="middle">Sine</text><rect class="button" x="176" y="830" width="92" height="32" rx="3"/><text class="label" x="222" y="851" text-anchor="middle">Keyframes</text><rect class="inner" x="286" y="830" width="236" height="32" rx="3"/><text class="small" x="300" y="851">Curve method</text></g>
  </g>
</svg>
