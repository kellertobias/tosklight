<?xml version="1.0" encoding="UTF-8"?>
<!-- Editable 1920x1080 desk-frame concept. All regions and encoder cards are named groups. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">ToskLight desk frame at 1080p with encoders</title>
  <desc id="desc">Dark lighting desk frame with show bar, fixture sheet, playback and six software encoders.</desc>
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152e42"/><stop offset="1" stop-color="#10151e"/></linearGradient>
    <style>
      .panel{fill:#11171c;stroke:#35434e;stroke-width:1}.inner{fill:#151d23;stroke:#35434e;stroke-width:1}.button{fill:#202a31;stroke:#40515d;stroke-width:1}.active{fill:#103545;stroke:#53c4df;stroke-width:1.5}.label{fill:#aebdc6;font:13px system-ui,sans-serif}.small{fill:#82939d;font:11px system-ui,sans-serif}.title{fill:#edf6f8;font:600 14px system-ui,sans-serif}.head{fill:#edf6f8;font:700 17px system-ui,sans-serif}.value{fill:#dff8ff;font:700 20px system-ui,sans-serif}
    </style>
  </defs>
  <g id="desk-frame-1080p">
    <rect width="1920" height="1080" fill="#090d11"/>
    <g id="show-bar"><rect class="panel" width="1920" height="58"/><text class="head" x="20" y="34">ToskLight</text><text class="small" x="122" y="33">Demo Show · Main Desk</text><rect class="active" x="480" y="14" width="120" height="30" rx="4"/><text class="title" x="540" y="34" text-anchor="middle">PROGRAMMER</text><text class="small" x="1510" y="33">Output enabled · 60 Hz</text><circle cx="1490" cy="29" r="5" fill="#65ce98"/><rect class="button" x="1740" y="14" width="156" height="30" rx="4"/><text class="title" x="1818" y="34" text-anchor="middle">Desk Setup</text></g>
    <g id="dock"><rect class="panel" x="0" y="58" width="70" height="802"/><g fill="#aebdc6" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle"><rect class="active" x="10" y="75" width="50" height="50" rx="5"/><text x="35" y="106">FIX</text><rect class="button" x="10" y="136" width="50" height="50" rx="5"/><text x="35" y="167">GRP</text><rect class="button" x="10" y="197" width="50" height="50" rx="5"/><text x="35" y="228">PRE</text><rect class="button" x="10" y="258" width="50" height="50" rx="5"/><text x="35" y="289">CUE</text><rect class="button" x="10" y="319" width="50" height="50" rx="5"/><text x="35" y="350">DYN</text><rect class="button" x="10" y="380" width="50" height="50" rx="5"/><text x="35" y="411">STG</text></g></g>
    <g id="fixture-sheet"><rect class="panel" x="70" y="58" width="1120" height="520"/><text class="head" x="90" y="90">Fixture Sheet</text><text class="small" x="90" y="110">12 selected · Main stage</text><g id="fixture-columns"><rect class="inner" x="88" y="128" width="1084" height="34"/><g class="small"><text x="104" y="150">ID</text><text x="170" y="150">NAME</text><text x="405" y="150">PATCH</text><text x="510" y="150">INTENSITY</text><text x="640" y="150">COLOR</text><text x="770" y="150">POSITION</text><text x="922" y="150">BEAM</text><text x="1050" y="150">FOCUS</text></g></g>
      <g id="fixture-rows" class="label"><rect x="88" y="163" width="1084" height="44" fill="#183541"/><text x="104" y="190">1</text><text x="170" y="190">Front Wash L</text><text x="405" y="190">1.001</text><text x="510" y="190">72%</text><circle cx="660" cy="185" r="11" fill="#9fc8ff"/><text x="770" y="190">Pan 32° · Tilt 48°</text><text x="922" y="190">42°</text><text x="1050" y="190">Sharp</text><rect x="88" y="208" width="1084" height="44" fill="#12191e"/><text x="104" y="235">2</text><text x="170" y="235">Front Wash R</text><text x="405" y="235">1.017</text><text x="510" y="235">72%</text><circle cx="660" cy="230" r="11" fill="#9fc8ff"/><text x="770" y="235">Pan -32° · Tilt 48°</text><text x="922" y="235">42°</text><text x="1050" y="235">Sharp</text><rect x="88" y="253" width="1084" height="44" fill="#151d23"/><text x="104" y="280">3</text><text x="170" y="280">Back Spot 1</text><text x="405" y="280">1.033</text><text x="510" y="280">0%</text><circle cx="660" cy="275" r="11" fill="#ffbc57"/><text x="770" y="280">Pan 0° · Tilt 65°</text><text x="922" y="280">18°</text><text x="1050" y="280">Soft</text><rect x="88" y="298" width="1084" height="44" fill="#12191e"/><text x="104" y="325">4</text><text x="170" y="325">Back Spot 2</text><text x="405" y="325">1.049</text><text x="510" y="325">0%</text><circle cx="660" cy="320" r="11" fill="#ffbc57"/><text x="770" y="325">Pan 0° · Tilt 65°</text><text x="922" y="325">18°</text><text x="1050" y="325">Soft</text></g>
      <text class="small" x="104" y="548">Fixture selection follows command line, keyboard, OSC, and attached hardware.</text></g>
    <g id="stage-pane"><rect class="panel" x="1210" y="58" width="710" height="520"/><text class="head" x="1230" y="90">Stage</text><text class="small" x="1230" y="110">Top view · 12 fixtures</text><rect x="1228" y="128" width="674" height="430" rx="4" fill="url(#stage)"/><path d="M1265 450h600M1265 325h600M1265 200h600M1365 158v365M1515 158v365M1665 158v365M1815 158v365" stroke="#35515c" stroke-width="1" opacity=".5"/><path d="M1265 450L1420 325 1520 390 1640 245 1865 450" fill="none" stroke="#65ce98" stroke-width="3" opacity=".75"/><g fill="#e9f7ff" stroke="#55c2dc" stroke-width="3"><circle cx="1420" cy="325" r="12"/><circle cx="1520" cy="390" r="12"/><circle cx="1640" cy="245" r="12"/><circle cx="1755" cy="360" r="12"/></g><text class="small" x="1240" y="540">Click to select · scroll to zoom</text></g>
    <g id="playback"><rect class="panel" x="70" y="578" width="1850" height="282"/><text class="head" x="90" y="610">Playbacks</text><text class="small" x="90" y="630">Page 1 · Main show</text>
      <g id="playback-cards"><g transform="translate(90 650)"><rect class="active" width="260" height="185" rx="5"/><text class="small" x="14" y="24">PLAYBACK 1</text><text class="head" x="14" y="54">Opening Look</text><rect x="14" y="78" width="232" height="82" rx="3" fill="#16485a"/><rect x="14" y="122" width="232" height="38" fill="#55c2dc" opacity=".6"/><text class="title" x="130" y="181" text-anchor="middle">GO</text></g><g transform="translate(365 650)"><rect class="button" width="260" height="185" rx="5"/><text class="small" x="14" y="24">PLAYBACK 2</text><text class="head" x="14" y="54">Verse</text><rect x="14" y="78" width="232" height="82" rx="3" fill="#513d77"/><text class="title" x="130" y="181" text-anchor="middle">GO</text></g><g transform="translate(640 650)"><rect class="button" width="260" height="185" rx="5"/><text class="small" x="14" y="24">PLAYBACK 3</text><text class="head" x="14" y="54">Chorus</text><rect x="14" y="78" width="232" height="82" rx="3" fill="#6b3b45"/><text class="title" x="130" y="181" text-anchor="middle">GO</text></g><g transform="translate(915 650)"><rect class="button" width="260" height="185" rx="5"/><text class="small" x="14" y="24">PLAYBACK 4</text><text class="head" x="14" y="54">Blackout</text><rect x="14" y="78" width="232" height="82" rx="3" fill="#2a2f36"/><text class="title" x="130" y="181" text-anchor="middle">GO</text></g></g></g>
    <g id="command-line"><rect class="panel" x="0" y="860" width="1920" height="72"/><text class="small" x="20" y="884">COMMAND LINE</text><rect class="inner" x="20" y="892" width="1130" height="28" rx="3"/><text class="title" x="34" y="912">Fixture 1 Thru 12 At 72</text><text class="small" x="1180" y="911">12 fixtures selected</text><rect class="button" x="1420" y="882" width="100" height="38" rx="4"/><text class="title" x="1470" y="906" text-anchor="middle">CLEAR</text><rect x="1532" y="882" width="100" height="38" rx="4" fill="#174e39" stroke="#65ce98"/><text class="title" x="1582" y="906" text-anchor="middle">ENTER</text><rect class="button" x="1644" y="882" width="100" height="38" rx="4"/><text class="title" x="1694" y="906" text-anchor="middle">UNDO</text></g>
    <g id="software-encoders"><rect class="panel" x="0" y="932" width="1920" height="148"/><text class="small" x="20" y="956">PROGRAMMER ENCODERS · POSITION / BEAM</text>
      <g id="encoder-1" transform="translate(20 968)"><rect class="inner" width="292" height="96" rx="5"/><text class="small" x="14" y="21">ENC 1 · POSITION</text><text class="title" x="14" y="44">Pan</text><text class="value" x="276" y="45" text-anchor="end">32°</text><rect x="14" y="62" width="264" height="8" rx="4" fill="#31434d"/><rect x="14" y="62" width="157" height="8" rx="4" fill="#55c2dc"/><circle cx="171" cy="66" r="10" fill="#dff8ff" stroke="#55c2dc" stroke-width="2"/><text class="small" x="14" y="88">Turn · Press-turn fine</text></g>
      <g id="encoder-2" transform="translate(330 968)"><rect class="inner" width="292" height="96" rx="5"/><text class="small" x="14" y="21">ENC 2 · POSITION</text><text class="title" x="14" y="44">Tilt</text><text class="value" x="276" y="45" text-anchor="end">48°</text><rect x="14" y="62" width="264" height="8" rx="4" fill="#31434d"/><rect x="14" y="62" width="177" height="8" rx="4" fill="#55c2dc"/><circle cx="191" cy="66" r="10" fill="#dff8ff" stroke="#55c2dc" stroke-width="2"/><text class="small" x="14" y="88">Turn · Press-turn fine</text></g>
      <g id="encoder-3" transform="translate(640 968)"><rect class="inner" width="292" height="96" rx="5"/><text class="small" x="14" y="21">ENC 3 · BEAM</text><text class="title" x="14" y="44">Zoom</text><text class="value" x="276" y="45" text-anchor="end">42°</text><rect x="14" y="62" width="264" height="8" rx="4" fill="#31434d"/><rect x="14" y="62" width="112" height="8" rx="4" fill="#b278e8"/><circle cx="126" cy="66" r="10" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="small" x="14" y="88">Turn</text></g>
      <g id="encoder-4" transform="translate(950 968)"><rect class="inner" width="292" height="96" rx="5"/><text class="small" x="14" y="21">ENC 4 · BEAM</text><text class="title" x="14" y="44">Focus</text><text class="value" x="276" y="45" text-anchor="end">Sharp</text><rect x="14" y="62" width="264" height="8" rx="4" fill="#31434d"/><rect x="14" y="62" width="232" height="8" rx="4" fill="#b278e8"/><circle cx="246" cy="66" r="10" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="small" x="14" y="88">Turn</text></g>
      <g id="encoder-5" transform="translate(1260 968)"><rect class="inner" width="292" height="96" rx="5"/><text class="small" x="14" y="21">ENC 5 · BEAM</text><text class="title" x="14" y="44">Iris</text><text class="value" x="276" y="45" text-anchor="end">Open</text><rect x="14" y="62" width="264" height="8" rx="4" fill="#31434d"/><circle cx="266" cy="66" r="10" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="small" x="14" y="88">Turn</text></g>
      <g id="encoder-6" transform="translate(1570 968)"><rect class="inner" width="330" height="96" rx="5"/><text class="small" x="14" y="21">ENC 6 · BEAM</text><text class="title" x="14" y="44">Gobo</text><text class="value" x="314" y="45" text-anchor="end">Open</text><rect x="14" y="62" width="302" height="8" rx="4" fill="#31434d"/><circle cx="300" cy="66" r="10" fill="#eee0ff" stroke="#b278e8" stroke-width="2"/><text class="small" x="14" y="88">Turn · Press opens choices</text></g>
    </g>
  </g>
</svg>
