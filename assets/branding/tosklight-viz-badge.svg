<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="viz-badge-title viz-badge-description">
  <title id="viz-badge-title">ToskLight Viz "3D" badge overlay</title>
  <desc id="viz-badge-description">A glowing white "3D" drawn in the neon-tube language of the ToskLight mark, sitting in the bottom-right corner of the 1024 px application tile.</desc>

  <!-- Drawn as round-capped strokes rather than set in a typeface, so the badge matches the
       tube-light forms of the mark and stays reproducible without a font dependency. Geometry is
       authored in a 296 x 190 box and placed by the transform below; the tile occupies
       71..953 on both axes, leaving a 63 px optical margin at the corner. -->
  <defs>
    <!-- Darkens the artwork immediately under the letters so the badge stays legible where it
         crosses the lit beam. Confined to the letterforms, so nothing spills past the tile. -->
    <filter id="viz-badge-contour" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="viz-badge-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="22" result="spread"/>
      <feFlood flood-color="#3f9dff" flood-opacity="1"/>
      <feComposite in2="spread" operator="in"/>
    </filter>
    <g id="viz-badge-glyphs">
      <path d="M 8 22 C 30 4 78 2 100 22 C 128 47 118 90 78 100"/>
      <path d="M 78 100 C 124 106 142 142 128 168 C 112 196 60 200 20 180"/>
      <path d="M 175 0 L 175 190"/>
      <path d="M 175 0 C 250 0 296 40 296 95 C 296 150 250 190 175 190"/>
    </g>
  </defs>

  <g id="viz-badge" transform="translate(613,701) scale(0.88)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#viz-badge-glyphs" xlink:href="#viz-badge-glyphs" stroke="#01050f" stroke-width="104" stroke-opacity="0.9" filter="url(#viz-badge-contour)"/>
    <use href="#viz-badge-glyphs" xlink:href="#viz-badge-glyphs" stroke="#3f9dff" stroke-width="50" filter="url(#viz-badge-glow)"/>
    <use href="#viz-badge-glyphs" xlink:href="#viz-badge-glyphs" stroke="#ffffff" stroke-width="40"/>
  </g>
</svg>
