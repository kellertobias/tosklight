[workspace]
resolver = "3"
members = [
  "apps/light-desktop/src-tauri",
  "apps/light-hardware-controls/src-tauri",
  "apps/light-headless",
  "apps/viz-editor/src-tauri",
  "crates/light",
  "crates/light/adapters/headless",
  "crates/light/adapters/media",
  "crates/light/contracts/wire",
  "crates/light/domain/control",
  "crates/light/domain/dynamics",
  "crates/light/domain/engine",
  "crates/light/domain/output",
  "crates/light/domain/playback",
  "crates/light/domain/programmer",
  "crates/shared/core",
  "crates/shared/discovery",
  "crates/shared/fixture",
  "crates/shared/mvr",
  "crates/shared/show",
  "crates/viz/scene",
  "crates/viz/laser",
  "crates/viz/dmx",
  "crates/viz/project",
  "crates/viz/desk",
  "crates/viz/document",
  "crates/viz/planning",
  "crates/viz/render",
  "crates/viz/snapshot",
  "apps/viz-renderer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
authors = ["Light contributors"]

[workspace.dependencies]
png = "0.18"
muda = "0.19"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "multipart", "ws"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled", "backup", "uuid"] }
rust-embed = { version = "8.7", features = ["interpolate-folder-path"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_ignored = "0.1"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
ts-rs = "12.0"
http-body-util = "0.1"
jiff = "0.2"
midir = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
quick-xml = "0.38"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
light-application = { path = "crates/light" }
light-wire = { path = "crates/light/contracts/wire" }
# Viz visualizer stack. These belong to `apps/viz-renderer` and `crates/viz/*` only; the
# ToskLight desk build must never require them.
wgpu = "30"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.4"
socket2 = { version = "0.6", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
# QuickJS, which runs the scan engine a laser fixture package ships with. Compiled from vendored
# C source, so `bindgen` (and the LLVM it wants) stays off; the crate carries generated bindings.
rquickjs = { version = "0.12", default-features = false, features = ["classes", "properties"] }
light-discovery = { path = "crates/shared/discovery" }
viz-scene = { path = "crates/viz/scene" }
viz-laser = { path = "crates/viz/laser" }
viz-dmx = { path = "crates/viz/dmx" }
viz-project = { path = "crates/viz/project" }
viz-desk = { path = "crates/viz/desk" }
viz-render = { path = "crates/viz/render" }
viz-snapshot = { path = "crates/viz/snapshot" }

[workspace.lints.rust]
unsafe_code = "forbid"

# The desk's development build is also the normal `npm run open` and Playwright runtime.
# Keep assertions and debug information, but optimize the per-frame semantic/output loops so
# development and acceptance runs can sustain the configured DMX cadence.
[profile.dev]
opt-level = 1
