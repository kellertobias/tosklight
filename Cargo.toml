[workspace]
resolver = "3"
members = [
  "apps/light-desktop/src-tauri",
  "apps/light-hardware-controls/src-tauri",
  "apps/light-headless",
  "apps/media",
  "apps/viz-editor/src-tauri",
  "crates/light",
  "crates/light/adapters/headless",
  "crates/light/adapters/extensions",
  "crates/light/adapters/media",
  "crates/light/adapters/usb-dmx-core",
  "crates/light/adapters/usb-dmx-serial",
  "crates/light/contracts/extensions",
  "crates/light/contracts/wire",
  "crates/light/domain/control",
  "crates/light/domain/dynamics",
  "crates/light/domain/engine",
  "crates/light/domain/output",
  "crates/light/domain/playback",
  "crates/light/domain/programmer",
  "crates/media/adapters/audio",
  "crates/media/adapters/citp",
  "crates/media/adapters/codec",
  "crates/media/adapters/http",
  "crates/media/adapters/library",
  "crates/media/adapters/net",
  "crates/media/adapters/pixel",
  "crates/media/adapters/playback",
  "crates/media/adapters/render",
  "crates/media/adapters/runtime",
  "crates/media/adapters/text",
  "crates/media/application",
  "crates/media/domain",
  "crates/shared/core",
  "crates/shared/discovery",
  "crates/shared/dmx",
  "crates/shared/fixture",
  "crates/shared/mvr",
  "crates/shared/psn",
  "crates/shared/show",
  "crates/viz/scene",
  "crates/viz/laser",
  "crates/viz/effect",
  "crates/viz/dmx",
  "crates/viz/project",
  "crates/viz/capture",
  "crates/viz/desk",
  "crates/viz/helper",
  "crates/viz/demo",
  "crates/viz/document",
  "crates/viz/planning",
  "crates/viz/render",
  "crates/viz/snapshot",
  "crates/viz/surface",
  "apps/viz-renderer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
authors = ["Light contributors"]

[workspace.dependencies]
rustc-hash = "2"
png = "0.18"
muda = "0.19"
# The menu bar / notification-area icon the Media Server runs as. Same maintainers and release
# cadence as `muda`, which it builds its menu with.
tray-icon = "0.24"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "multipart", "ws"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled", "backup", "uuid"] }
rust-embed = { version = "8.7", features = ["interpolate-folder-path"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_ignored = "0.1"
serde_json = "1.0"
serialport = "4.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
ts-rs = "12.0"
http-body-util = "0.1"
jiff = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "v5", "serde"] }
quick-xml = "0.38"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
light-application = { path = "crates/light" }
light-wire = { path = "crates/light/contracts/wire" }
# Viz visualizer stack. These belong to `apps/viz-renderer` and `crates/viz/*` only; the
# ToskLight desk build must never require them.
wgpu = "30"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck", "serde"] }
# The desk-to-helper channel. A private pipe between two processes of the same build, carrying
# values JSON cannot represent: an empty scene's bounds are infinities.
postcard = { version = "1", features = ["use-std"] }
bytemuck = { version = "1.23", features = ["derive"] }
pollster = "0.4"
socket2 = { version = "0.6", features = ["all"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
# QuickJS, which runs the scan engine a laser fixture package ships with. Compiled from vendored
# C source, so `bindgen` (and the LLVM it wants) stays off; the crate carries generated bindings.
rquickjs = { version = "0.12", default-features = false, features = ["classes", "properties"] }
light-discovery = { path = "crates/shared/discovery" }
light-dmx-wire = { path = "crates/shared/dmx" }
viz-scene = { path = "crates/viz/scene" }
viz-laser = { path = "crates/viz/laser" }
viz-effect = { path = "crates/viz/effect" }
viz-dmx = { path = "crates/viz/dmx" }
viz-project = { path = "crates/viz/project" }
viz-desk = { path = "crates/viz/desk" }
viz-render = { path = "crates/viz/render" }
viz-snapshot = { path = "crates/viz/snapshot" }

[workspace.lints.rust]
unsafe_code = "deny"

# The desk's development build is also the normal `npm run open` and Playwright runtime.
# Keep assertions and debug information, but optimize the per-frame semantic/output loops so
# development and acceptance runs can sustain the configured DMX cadence.
[profile.dev]
opt-level = 1
incremental = true
# macOS defaults dev builds to `split-debuginfo = "unpacked"`, which leaves every codegen unit's
# object file on disk forever so the debug map can find its DWARF. Cargo never collects them, so
# the shared target grew to 362 GB across 1.2M files and a no-op `check --workspace` spent 4m33s
# stat-ing them. Full DWARF for 900 dependencies buys nothing here; line tables keep backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The macOS filesystem stalls this block previously blamed on incremental compilation were really
# retained `.rcgu.o` files from unpacked split-debuginfo; capping debuginfo above fixes the cause.
# Incremental is a 3.5x win on the edit-rebuild loop: 12.1s -> 3.4s on `check --workspace`.
[profile.test]
incremental = true
