name: Operator manual

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify PDF and HTML manuals
        run: npm run manual
